[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listen-gen"
version = "0.5.2"
description = "Heavy resource generation and content packaging for Listen"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0,<7",
]

[project.optional-dependencies]
tts = [
    "kokoro>=0.8",
    "soundfile>=0.12",
]
ocr = [
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "surya-ocr>=0.6.0",
    "rapidocr-onnxruntime>=1.3.0",
]
# Forced alignment via Qwen3-ForcedAligner-0.6B. The aligner needs a
# Transformers build that ships the Qwen3 forced-aligner classes; until it is
# in a tagged release, install Transformers from source alongside these.
align = [
    "qwen-asr>=0.1",
    "librosa>=0.10",
    "torch>=2.1",
]
# Default ASR provider: Qwen3-ASR-0.6B, run by tools/qwen3_asr_wrapper.py. Same
# runtime as the forced aligner (also needs a Transformers build shipping the
# Qwen3-ASR classes).
asr-qwen = [
    "qwen-asr>=0.1",
    "soundfile>=0.12",
    "torch>=2.1",
]
# Fast / CPU ASR provider: SenseVoiceSmall via FunASR, run by
# tools/sensevoice_asr_wrapper.py.  FunASR pulls the model from ModelScope, so
# the default model id is the FunASR/ModelScope id ``iic/SenseVoiceSmall``.
asr-sensevoice = [
    "funasr>=1.1",
    "torch>=2.1",
    "torchaudio>=2.1",
    "soundfile>=0.12",
]
all = [
    "kokoro>=0.8",
    "soundfile>=0.12",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "surya-ocr>=0.6.0",
    "rapidocr-onnxruntime>=1.3.0",
    "qwen-asr>=0.1",
    "funasr>=1.1",
    "librosa>=0.10",
    "torch>=2.1",
    "torchaudio>=2.1",
]

[project.scripts]
listen-gen = "listen_gen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
