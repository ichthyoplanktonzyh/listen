        "200": { description: Downloaded subtitle bytes }
  /v1/vocabulary:
    get:
      operationId: listVocabulary
      parameters:
        - { name: language, in: query, schema: { type: string, default: en } }
        - { name: kind, in: query, schema: { enum: [word, phrase] }, description: "Omit to include both words and phrases." }
        - { name: status, in: query, schema: { enum: [unknown_meaning, known_not_recognized, known_recognized] }, description: "Legacy status axis; optional." }
        - { name: capability, in: query, schema: { enum: [reading, listening, speaking, writing] }, description: "Capability-dimension filter; requires assessment." }
        - { name: assessment, in: query, schema: { enum: [unassessed, not_acquired, acquired] }, description: "Effective assessment to match for capability; requires capability." }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Dynamic vocabulary book
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LexicalEntryDetails" } }
  /v1/corpus/search:
