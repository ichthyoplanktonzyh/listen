              schema: { type: array, items: { $ref: "#/components/schemas/UpgradeSuggestion" } }
  /v1/review/upgrade-suggestions/history:
    get:
      operationId: upgradeSuggestionHistory
      parameters:
        - { name: lexical_entry_id, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Recognition upgrade suggestion history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UpgradeSuggestion" } }
  /v1/review/upgrade-suggestions/{id}/confirm:
    post:
      operationId: confirmUpgradeSuggestion
