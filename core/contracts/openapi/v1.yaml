      responses:
        "200":
          description: Track cache status and optional shared consumer batch
          content:
            application/json:
              schema:
                type: object
                required: [status, fingerprint, cache_hit, sentence_count, analyzed_sentence_count, fallback_sentence_count]
                properties:
                  status: { type: string, enum: [unavailable, analyzing, ready, partial, failed, stale] }
