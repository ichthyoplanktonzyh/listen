        affected_token_end: { type: integer, minimum: 0 }
        canonical_phones:
          type: array
          items: { type: string }
        detected_phones:
          type: array
          items: { type: string }
        aligned_phone_start: { type: [integer, "null"], minimum: 0 }
        aligned_phone_end: { type: [integer, "null"], minimum: 0 }
        audio_start_ms: { type: integer, minimum: 0 }
        audio_end_ms: { type: integer, minimum: 0 }
