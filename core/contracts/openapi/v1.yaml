openapi: 3.1.0
info:
  title: LLPlayerNext Local API
  version: 1.0.0
  description: Versioned loopback-only application-service adapter. Playback control is excluded.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service health and API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/media:
    get:
      operationId: listMediaLibrary
      responses:
        "200":
          description: >
            Media library for triage (Phase 3.5): every registered media with
            cached content fit, user triage intent, and familiar-material
            mark. Queue grouping is derived client-side; nothing here gates
            access to any media.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaLibraryEntry" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: registerMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMedia"
      responses:
        "200":
          description: Idempotently registered media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/triage-intent:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    put:
      operationId: setMediaTriageIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTriageIntentRequest"
      responses:
        "200":
          description: Updated library entry after storing or clearing intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaLibraryEntry"
        default:
          $ref: "#/components/responses/Error"
  /v1/lltimeline/import:
    post:
      operationId: importLLTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLTimelineDocument"
      responses:
        "200":
          description: Imported LLTimeline JSON v1 resource document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
  /v1/media/{media_id}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: readMedia
      responses:
        "200":
          description: Media metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/progress:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: readProgress
      responses:
        "200":
          description: Last saved position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Progress"
      responses:
        "200":
          description: Saved position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/subtitles:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: mediaSubtitles
      responses:
        "200":
          description: Subtitle resources associated with a media item
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubtitleTrack" }
    post:
      operationId: importSubtitle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSubtitle"
      responses:
        "200":
          description: Complete normalized subtitle timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/lltimeline/import:
    parameters:
      - $ref: "#/components/parameters/MediaId"
      - name: allow_mismatch
        in: query
        required: false
        schema: { type: boolean }
        description: Allow user-confirmed attachment when the resource media fingerprint differs.
    post:
      operationId: importLLTimelineForMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLTimelineDocument"
      responses:
        "200":
          description: Imported and attached LLTimeline JSON v1 resource document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
  /v1/subtitles/{track_id}:
    parameters:
      - name: track_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: readSubtitle
      responses:
        "200":
          description: Complete normalized subtitle timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSubtitle
      responses:
        "200":
          description: Deleted subtitle resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
  /v1/subtitles/{track_id}/archive:
    parameters:
      - name: track_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: archiveSubtitle
      responses:
        "200":
          description: Archived subtitle resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
  /v1/subtitles/{track_id}/restore:
    parameters:
      - name: track_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: restoreSubtitle
      responses:
        "200":
          description: Restored subtitle resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
  /v1/subtitles/{track_id}/language:
    parameters:
      - name: track_id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTrackLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrackLanguage"
      responses:
        "200":
          description: Updated subtitle learning language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
  /v1/subtitles/{track_id}/export:
    get:
      operationId: exportSubtitle
      parameters:
        - { name: track_id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, default: srt } }
      responses:
        "200": { description: Generated SRT subtitle }
  /v1/subtitles/{track_id}/content-fit:
    get:
      operationId: trackContentFit
      description: >-
        Dual-dimension content fit (ADR 0018) for the track's media, served
        from a fingerprint-validated cache. Bands are expectation management,
        never gates; signals explain each band.
      parameters:
        - { name: track_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Media-level dual-dimension content difficulty profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDifficultyProfile" }
  /v1/subtitles/{track_id}/cold-start-words:
    get:
      operationId: coldStartWords
      description: >-
        High-frequency unassessed words from the track transcript, for the
        cold-start quick-marking flow. Normalized through the same lexical
        path as content fit so that marking a word immediately raises the
        assessed token ratio.
      parameters:
        - { name: track_id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Candidate words sorted by occurrence count descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ColdStartWordCandidate" }
  /v1/pronunciation/providers:
    get:
      operationId: pronunciationProviders
      responses:
        "200": { description: Provider-neutral pronunciation capability registry }
  /v1/pronunciation/lookup:
    get:
      operationId: pronunciationLookup
      parameters:
        - { name: word, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Canonical word pronunciation and variants }
  /v1/pronunciation/analyze-sentence:
    post:
      operationId: analyzeSentencePronunciation
      responses:
        "200": { description: Sentence pronunciation, token mapping, and rule hints }
  /v1/pronunciation/rules:
    get:
      operationId: pronunciationRules
      responses:
        "200": { description: Deterministic rule analyzer metadata and disclaimer }
  /v1/subtitles/{track_id}/pronunciation:
    get:
      operationId: trackPronunciation
      responses:
        "200": { description: Cached or generated pronunciation analyses for a track }
  /v1/subtitles/{track_id}/pronunciation-analysis:
    post:
      operationId: generateTrackPronunciation
      responses:
        "200": { description: Generated pronunciation analyses for a track }
  /v1/subtitles/{track_id}/word-timings:
    get:
      operationId: trackWordTimings
      responses:
        "200":
          description: Word timings with source and provider provenance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WordTiming" }
    post:
      operationId: generateTrackWordTimings
      responses:
        "200":
          description: Generated word timings with safe estimated fallback
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WordTiming" }
  /v1/subtitles/{track_id}/word-timelines:
    get:
      operationId: trackWordTimelines
      responses:
        "200":
          description: Versioned word timeline resources for a subtitle track
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WordTimeline" }
    post:
      operationId: createTrackWordTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWordTimeline"
      responses:
        "200":
          description: Created word timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordTimeline"
  /v1/subtitles/{track_id}/word-timelines/summary:
    get:
      operationId: trackWordTimelineSummaries
      responses:
        "200":
          description: Summaries for manageable word timeline resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WordTimelineSummary" }
  /v1/subtitles/{track_id}/lltimeline/export:
    get:
      operationId: exportTrackLLTimeline
      responses:
        "200":
          description: Exportable LLTimeline JSON v1 resource document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLTimelineDocument"
  /v1/word-timelines/{timeline_id}:
    get:
      operationId: wordTimeline
      responses:
        "200":
          description: Versioned word timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordTimeline"
    delete:
      operationId: deleteWordTimeline
      responses:
        "200":
          description: Deleted word timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordTimeline"
  /v1/word-timelines/{timeline_id}/activate:
    post:
      operationId: activateWordTimeline
      responses:
        "200":
          description: Activated word timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordTimeline"
  /v1/word-timelines/{timeline_id}/publish:
    post:
      operationId: publishWordTimeline
      responses:
        "200":
          description: Marked word timeline as published and activated it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordTimeline"
  /v1/word-timelines/{timeline_id}/archive:
    post:
      operationId: archiveWordTimeline
      responses:
        "200":
          description: Archived word timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordTimeline"
  /v1/word-timelines/{timeline_id}/export:
    get:
      operationId: exportWordTimeline
      responses:
        "200":
          description: Exportable word timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordTimeline"
  /v1/subtitles/{track_id}/word-timing-diagnostics:
    get:
      operationId: trackWordTimingDiagnostics
      responses:
        "200": { description: Developer-facing inter-word gaps with timing source and provider provenance }
  /v1/subtitles/{track_id}/chunk-partitions:
    get:
      operationId: trackChunkPartitions
      responses:
        "200": { description: Product-facing complete chunk partitions for a subtitle track }
  /v1/subtitles/{track_id}/chunk-diagnostics:
    get:
      operationId: trackChunkDiagnostics
      responses:
        "200": { description: Developer-facing selected and rejected chunk boundary evidence }
  /v1/chunk/providers:
    get:
      operationId: chunkProviders
      responses:
        "200": { description: Optional learned chunk evidence providers, revisions, runtimes, and licenses }
  /v1/subtitles/{track_id}/chunk-timelines:
    get:
      operationId: trackChunkTimelines
      responses:
        "200":
          description: Versioned chunk timeline resources for a subtitle track
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChunkTimeline" }
    post:
      operationId: generateChunkTimeline
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateChunkTimeline"
      responses:
        "200":
          description: Generated chunk timeline candidate from the active word timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkTimeline"
  /v1/subtitles/{track_id}/chunk-timelines/summary:
    get:
      operationId: trackChunkTimelineSummaries
      responses:
        "200":
          description: Summaries for manageable chunk timeline resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChunkTimelineSummary" }
  /v1/chunk-timelines/{timeline_id}:
    get:
      operationId: chunkTimeline
      responses:
        "200":
          description: Versioned chunk timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkTimeline"
    delete:
      operationId: deleteChunkTimeline
      responses:
        "200":
          description: Deleted chunk timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkTimeline"
  /v1/chunk-timelines/{timeline_id}/activate:
    post:
      operationId: activateChunkTimeline
      responses:
        "200":
          description: Activated chunk timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkTimeline"
  /v1/chunk-timelines/{timeline_id}/archive:
    post:
      operationId: archiveChunkTimeline
      responses:
        "200":
          description: Archived chunk timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkTimeline"
  /v1/chunk-timelines/{timeline_id}/export:
    get:
      operationId: exportChunkTimeline
      responses:
        "200":
          description: Exportable chunk timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkTimeline"
  /v1/subtitles/{track_id}/sense-group-analyses:
    get:
      operationId: trackSenseGroupAnalyses
      responses:
        "200":
          description: Sense group analysis resources for a subtitle track
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SenseGroupAnalysis" }
    post:
      operationId: generateSenseGroupAnalysis
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSenseGroupAnalysis"
      responses:
        "200":
          description: Generated sense group analysis from rule-based partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenseGroupAnalysis"
  /v1/subtitles/{track_id}/sense-group-analyses/summary:
    get:
      operationId: trackSenseGroupAnalysisSummaries
      responses:
        "200":
          description: Summaries for sense group analysis resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SenseGroupAnalysisSummary" }
  /v1/subtitles/{track_id}/syntactic-consumers:
    post:
      operationId: runSyntacticConsumers
      description: Runs the optional qualified syntax provider once for the track and shares per-sentence artifacts across Reference B, SenseGroup, and dependency candidate matching; unavailable or invalid syntax returns explicit existing fallbacks.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                patterns:
                  type: array
                  items: { $ref: "#/components/schemas/SyntacticDependencyPattern" }
      responses:
        "200":
          description: Shared syntax consumer batch or explicit fallback batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyntacticConsumerBatch"
  /v1/subtitles/{track_id}/syntax-analysis:
    get:
      operationId: trackSyntaxAnalysisStatus
      responses:
        "200":
          description: Current cache state; stale means the track or qualified model fingerprint changed
    post:
      operationId: runTrackSyntaxAnalysis
      description: Reuses or rebuilds the optional whole-track syntax batch cache; each sentence remains independently validated.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
                patterns:
                  type: array
                  items: { $ref: "#/components/schemas/SyntacticDependencyPattern" }
      responses:
        "200":
          description: Track cache status and optional shared consumer batch
          content:
            application/json:
              schema:
                type: object
                required: [status, fingerprint, cache_hit, sentence_count, analyzed_sentence_count, fallback_sentence_count]
                properties:
                  status: { type: string, enum: [unavailable, analyzing, ready, partial, failed, stale] }
                  fingerprint: { type: string }
                  cache_hit: { type: boolean }
                  sentence_count: { type: integer, minimum: 0 }
                  analyzed_sentence_count: { type: integer, minimum: 0 }
                  fallback_sentence_count: { type: integer, minimum: 0 }
                  batch: { $ref: "#/components/schemas/SyntacticConsumerBatch" }
  /v1/syntax/capability:
    get:
      operationId: syntaxCapability
      responses:
        "200":
          description: Persisted optional syntax capability state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyntaxCapabilityView" }
  /v1/syntax/capability/install:
    post: { operationId: installSyntaxCapability, responses: { "200": { description: Installation started } } }
  /v1/syntax/capability/cancel:
    post: { operationId: cancelSyntaxCapability, responses: { "200": { description: Installation cancelled } } }
  /v1/syntax/capability/validate:
    post: { operationId: validateSyntaxCapability, responses: { "200": { description: Installation validated } } }
  /v1/syntax/capability/enable:
    post: { operationId: enableSyntaxCapability, responses: { "200": { description: Capability enabled } } }
  /v1/syntax/capability/disable:
    post: { operationId: disableSyntaxCapability, responses: { "200": { description: Capability disabled } } }
  /v1/syntax/capability/uninstall:
    post: { operationId: uninstallSyntaxCapability, responses: { "200": { description: Capability uninstalled } } }
  /v1/syntax/capability/update:
    post: { operationId: updateSyntaxCapability, responses: { "200": { description: Capability update started } } }
  /v1/sense-group-analyses/{analysis_id}:
    get:
      operationId: senseGroupAnalysis
      responses:
        "200":
          description: Sense group analysis resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenseGroupAnalysis"
    delete:
      operationId: deleteSenseGroupAnalysis
      responses:
        "200":
          description: Deleted sense group analysis resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenseGroupAnalysis"
  /v1/sense-group-analyses/{analysis_id}/activate:
    post:
      operationId: activateSenseGroupAnalysis
      responses:
        "200":
          description: Activated sense group analysis resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenseGroupAnalysis"
  /v1/sense-group-analyses/{analysis_id}/archive:
    post:
      operationId: archiveSenseGroupAnalysis
      responses:
        "200":
          description: Archived sense group analysis resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenseGroupAnalysis"
  /v1/subtitles/{track_id}/phone-timelines:
    get:
      operationId: trackPhoneTimelines
      responses:
        "200":
          description: Versioned phone timeline resources for a subtitle track
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PhoneTimeline" }
  /v1/subtitles/{track_id}/phone-timelines/summary:
    get:
      operationId: trackPhoneTimelineSummaries
      responses:
        "200":
          description: Summaries for manageable phone timeline resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PhoneTimelineSummary" }
  /v1/phone-timelines/{timeline_id}:
    get:
      operationId: phoneTimeline
      responses:
        "200":
          description: Versioned phone timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneTimeline"
    delete:
      operationId: deletePhoneTimeline
      responses:
        "200":
          description: Deleted phone timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneTimeline"
  /v1/phone-timelines/{timeline_id}/activate:
    post:
      operationId: activatePhoneTimeline
      responses:
        "200":
          description: Activated phone timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneTimeline"
  /v1/phone-timelines/{timeline_id}/archive:
    post:
      operationId: archivePhoneTimeline
      responses:
        "200":
          description: Archived phone timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneTimeline"
  /v1/phone-timelines/{timeline_id}/export:
    get:
      operationId: exportPhoneTimeline
      responses:
        "200":
          description: Exportable phone timeline resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneTimeline"
  /v1/speech/jobs:
    get:
      operationId: speechBatchJobs
      responses:
        "200": { description: In-memory speech enhancement batch jobs }
    post:
      operationId: createSpeechBatchJob
      responses:
        "200": { description: Queued non-blocking pronunciation or word timing job }
  /v1/speech/jobs/{job_id}:
    get:
      operationId: speechBatchJob
      responses:
        "200": { description: Speech enhancement batch job status }
  /v1/speech/jobs/{job_id}/cancel:
    post:
      operationId: cancelSpeechBatchJob
      responses:
        "200": { description: Cancelled speech enhancement batch job }
  /v1/speech/jobs/{job_id}/retry:
    post:
      operationId: retrySpeechBatchJob
      responses:
        "200": { description: Retried speech enhancement batch job }
  /v1/sound-line/jobs:
    get:
      operationId: soundLineJobs
      responses:
        "200": { description: In-memory sound-line (listening structure) jobs }
    post:
      operationId: createSoundLineJob
      responses:
        "200": { description: Queued background sound-line enrichment job }
  /v1/sound-line/jobs/{job_id}:
    get:
      operationId: soundLineJob
      responses:
        "200": { description: Sound-line job status }
  /v1/sound-line/jobs/{job_id}/cancel:
    post:
      operationId: cancelSoundLineJob
      responses:
        "200": { description: Cancelled sound-line job }
  /v1/sound-line/jobs/{job_id}/retry:
