openapi: 3.1.0
info:
  title: LLPlayerNext Local API
  version: 5.0.0
  description: >
    Versioned loopback-only application-service adapter. Playback control is
    excluded. Contract `5.0.0` narrows the active product to audio/video
    learning: Media Materials, media-derived structured reading and alignment,
    listening activities, listening-only coaching, learner-owned listening
    facts, and review. Standalone document materials, conversation, and
    production tasks are not part of this API contract. Coaching recommendations
    remain evidence-based and never bypass learner confirmation. Responses stay
    path-free, and package adoption binds generated listening resources to an
    exact media revision.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service health and API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/media:
    get:
      operationId: listMediaLibrary
      responses:
        "200":
          description: >
            Personal Library for listening: retained media only, with the
            user's explicit triage intent and primary transcript. Temporary
            Material (registered with `retain: false`, or removed via the
            library-membership operation) stays readable through
            `/v1/media/{media_id}` but is absent here.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaLibraryEntry" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: registerMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMedia"
      responses:
        "200":
          description: Idempotently registered media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/triage-intent:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    put:
      operationId: setMediaTriageIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTriageIntentRequest"
      responses:
        "200":
          description: Updated library entry after storing or clearing intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaLibraryEntry"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/library-membership:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    put:
      operationId: retainMedia
      description: >
        Explicit learner intent to add an existing media item to the Personal
        Library. Idempotent: retaining an already-retained item preserves the
        original membership timestamp (`retained_at_ms`) and changes nothing
        else. Unknown media is a typed not-found. Media identity,
        availability, progress, subtitles, resources, vocabulary facts,
        Personal Expressions, attempts and other learning records are never
        touched by this operation.
      responses:
        "200":
          description: Updated media item carrying membership evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unretainMedia
      description: >
        Explicit learner intent to remove an existing media item from the
        Personal Library. Unretaining changes membership only: the media stays
        registered and readable by ID, and progress, subtitles, resources,
        vocabulary facts, Personal Expressions, attempts and other learning
        records remain intact. Unknown media is a typed not-found.
        Unretaining an already unretained item is a no-op (idempotent).
      responses:
        "200":
          description: Updated media item without membership evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials:
    get:
      operationId: listLearningMaterials
      description: >
        Lists Personal Library materials only: every retained learning
        material with its actual current revision and composition shape.
        Temporary Material (created with `retain: false`, or removed via the
        library-membership operation) stays readable through
        `/v1/materials/{material_id}` and `/v1/media/{media_id}/material` but
        is absent here. Material retention is logical state independent of any
        file location; no material, revision, or asset response ever contains
        a path.
      responses:
        "200":
          description: Retained materials with their current revisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaterialDetails" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLearningMaterial
      description: >
        Creates (or converges on) a learning material from Source Assets and
        typed Document/Media Renditions. Omitted (or null) `retain` means
        Personal Library member; explicit `false` creates Temporary Material,
        which is readable by ID and resolvable from media but excluded from
        the material library until explicitly retained. Document renditions
        carry inline text plus an optional nullable language and may bind a
        Source Asset by index; media renditions reference an already-registered
        media source by `media_id` and snapshot its kind, fingerprint, and
        availability — never its path. Raw material is valid without
        enrichment, and idempotent/convergent application semantics remain
        authoritative: retries resolve to the same deterministic material and
        revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLearningMaterial"
      responses:
        "200":
          description: Created or converged learning material with its current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetails"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      operationId: readLearningMaterial
      description: >
        Reads a learning material with its actual current revision and shape.
        Unknown or malformed material ids are typed errors. Temporary Material
        is readable here.
      responses:
        "200":
          description: Learning material with its current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetails"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    post:
      operationId: appendLearningMaterialRevision
      description: >
        Appends a new immutable revision to an existing material and returns
        the updated details. The request uses the same typed asset inputs as
        creation. Content-idempotent retries converge on the existing
        revision. Media renditions bound to another material are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendMaterialRevision"
      responses:
        "200":
          description: Updated learning material with the appended current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetails"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/revisions/{revision_id}:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
      - $ref: "#/components/parameters/MaterialRevisionId"
    get:
      operationId: readLearningMaterialRevision
      description: >
        Reads one historical or current revision. The revision is returned
        only when it belongs to the requested material; a revision owned by
        another material, or an unknown material or revision, is a typed
        not-found.
      responses:
        "200":
          description: The requested historical or current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/library-membership:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    put:
      operationId: retainLearningMaterial
      description: >
        Explicit learner intent to add an existing learning material to the
        Personal Library. Idempotent: retaining an already-retained material
        preserves the original membership timestamp (`retained_at_ms`) and
        changes nothing else. Membership synchronizes to every media bound to
        the material, so the legacy media projection and material retention
        agree. Unknown material is a typed not-found. Revisions, media
        bindings, resources, and learner state are never touched.
      responses:
        "200":
          description: Updated learning material carrying membership evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetails"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unretainLearningMaterial
      description: >
        Explicit learner intent to remove an existing learning material from
        the Personal Library. Idempotent: unretaining an already-temporary
        material is a no-op. Unretaining changes membership only — the
        material stays readable by ID, its revisions and media bindings stay
        intact, and resources and learner state remain untouched. Unknown
        material is a typed not-found.
      responses:
        "200":
          description: Updated learning material without membership evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetails"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/source-assets/{source_asset_id}/availability:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
      - in: path
        name: source_asset_id
        required: true
        schema: { type: string }
    put:
      operationId: updateSourceAssetAvailability
      description: >
        Updates the local availability fact of one Source Asset of the
        Material's current revision. Availability is a runtime fact about the
        exact bytes, never a change to identity or membership: the Source
        Asset, its revision, and every binding survive, and no new revision is
        appended. A missing referenced asset becomes an unavailable fact; it is
        never a reason to delete the Material or its membership. Unknown
        material or source asset is a typed not-found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceAssetAvailabilityInput"
      responses:
        "200":
          description: The Material's current revision with the updated availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/capabilities:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      operationId: listMaterialCapabilities
      description: >
        Projects the Material's capability state for every capability:
        `available`, `derivable`, `generating`, `unavailable`, or
        `failed_attempt`, each with the latest durable attempt (when any).
        Attempts are the unit of `generating` / `failed_attempt` evidence; a
        failed attempt never invalidates an otherwise usable Material. Unknown
        material is a typed not-found.
      responses:
        "200":
          description: The five-state capability projection per capability
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaterialCapabilityProjection" }
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/capability-attempts:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    post:
      operationId: startMaterialCapabilityAttempt
      description: >
        Starts a durable production attempt for one capability. Retrying
        creates a new attempt and never rewrites an earlier attempt's facts.
        Unknown material is a typed not-found; an unknown capability is a
        typed invalid-input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCapabilityAttemptRequest"
      responses:
        "200":
          description: The running attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityAttempt"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/capability-attempts/{attempt_id}:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
      - in: path
        name: attempt_id
        required: true
        schema: { type: string }
    put:
      operationId: finalizeMaterialCapabilityAttempt
      description: >
        Finalizes a running attempt as succeeded (with the producing tool) or
        failed (with a public reason). Only that attempt's facts are
        rewritten; other attempts stay untouched. Unknown material or attempt
        is a typed not-found; finalizing a non-running attempt is a typed
        conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeCapabilityAttemptRequest"
      responses:
        "200":
          description: The finalized attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityAttempt"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/package-installations:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    post:
      operationId: installMaterialPackage
      description: >
        Installs one local Content Package v3 release for the Material's
        actual current revision as candidate Learning Resources. Candidate
        only: the release is validated against the Material and current
        revision, prepared, and durably persisted together with every
        verified resource payload; it never adopts an Edition or changes any
        active selection, and an equal retry is idempotent (same release,
        original installation time preserved). The request carries only a
        local `package_path`; no response ever exposes a package or media
        path, manifest or release JSON, payload bytes, blob path, schema,
        digest, size, dependency edges, internal persistence facts, or
        provider/model raw output. A blank path, unreadable or malformed
        carrier, incompatibility, or Material/Revision mismatch is a typed
        422; unknown material is a typed 404; repository/internal failure is
        a typed 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallMaterialPackageRequest"
      responses:
        "200":
          description: Installed Learning Edition candidate with adoption evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEditionDetails"
        "404":
          description: >
            Typed not-found: unknown material. `code` is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  summary: Unknown material
                  value:
                    code: not_found
                    message: material was not found
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        "422":
          description: >
            Typed invalid installation: an unreadable or malformed carrier, an
            incompatible release, a Material/Revision mismatch, or a missing
            required dependency closure. `code` is
            `package_installation_invalid`, the public message is `package
            release is invalid or incompatible`, and `retryable` is `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidInstallation:
                  summary: Invalid or incompatible package release
                  value:
                    code: package_installation_invalid
                    message: package release is invalid or incompatible
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        "500":
          description: >
            Typed repository/internal failure. `code` is
            `package_lifecycle_failed`, the public message is `local package
            lifecycle operation failed`, and `retryable` is `true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                lifecycleFailed:
                  summary: Local package lifecycle failure
                  value:
                    code: package_lifecycle_failed
                    message: local package lifecycle operation failed
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: true
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/editions:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      operationId: listLearningEditions
      description: >
        Lists every installed Learning Edition of the Material's actual
        current revision with current-adoption evidence, ordered by release
        id. Installations of any other revision are never shown. Unknown
        material is a typed 404.
      responses:
        "200":
          description: Installed Learning Editions of the current revision
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearningEditionDetails" }
        "404":
          description: >
            Typed not-found: unknown material. `code` is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  summary: Unknown material
                  value:
                    code: not_found
                    message: material was not found
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        "500":
          description: >
            Typed repository/internal failure. `code` is
            `package_lifecycle_failed`, the public message is `local package
            lifecycle operation failed`, and `retryable` is `true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                lifecycleFailed:
                  summary: Local package lifecycle failure
                  value:
                    code: package_lifecycle_failed
                    message: local package lifecycle operation failed
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: true
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/editions/{release_id}:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
      - $ref: "#/components/parameters/PackageReleaseId"
    delete:
      operationId: deleteLearningEdition
      description: >
        Deletes one installed Learning Edition candidate for the Material,
        including its immutable installation facts, resource payloads, and
        rendition blobs. A candidate currently adopted by the Material cannot
        be deleted (returns typed 409 conflict); the caller must switch or
        reject adoption before deleting. Unknown material or uninstalled
        release is a typed 404; repository/internal failure is a typed 500.
      responses:
        "204":
          description: Candidate Learning Edition successfully deleted
        "404":
          description: >
            Typed not-found: unknown material, or the release was not
            installed for this material. `code` is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  summary: Unknown material or release
                  value:
                    code: not_found
                    message: package release installation was not found
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        "409":
          description: >
            Typed conflict: cannot delete a currently adopted Learning
            Edition. `code` is `cannot_delete_adopted_edition`, the public
            message is `cannot delete currently adopted package release; switch
            adoption first`, and `retryable` is `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                adoptedConflict:
                  summary: Currently adopted edition
                  value:
                    code: cannot_delete_adopted_edition
                    message: cannot delete currently adopted package release; switch adoption first
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        "500":
          description: >
            Typed repository/internal failure. `code` is
            `package_lifecycle_failed`, the public message is `local package
            lifecycle operation failed`, and `retryable` is `true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                lifecycleFailed:
                  summary: Local package lifecycle failure
                  value:
                    code: package_lifecycle_failed
                    message: local package lifecycle operation failed
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: true
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/edition-adoption:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    put:
      operationId: adoptLearningEdition
      description: >
        Explicitly adopts one installed Package Release for the Material's
        actual current revision: the use case resolves one coherent,
        dependency-closed selection from the immutable installed facts and
        commits the adoption atomically. Idempotent: re-adopting the current
        release preserves the original `adopted_at_ms` and changes nothing
        else. A release installed for a stale revision, a missing required
        resource, a broken dependency closure, or an exclusive-resource
        ambiguity is a typed 409 and never exposes resource ids or the
        internal selection plan; an unknown material or a release that is not
        installed is a typed 404; repository/internal failure is a typed 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptLearningEditionRequest"
      responses:
        "200":
          description: The adopted Learning Edition with adoption evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEditionDetails"
        "404":
          description: >
            Typed not-found: unknown material, or the release was never
            installed for this material. `code` is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  summary: Unknown material or absent installation
                  value:
                    code: not_found
                    message: package release installation was not found
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        "409":
          description: >
            Typed adoption conflict: the release is installed for a stale
            revision, a required resource is missing, a dependency closure is
            broken, or an exclusive resource family is ambiguous. `code` is
            `edition_adoption_conflict`, the public message is `learning
            edition cannot be adopted`, and `retryable` is `false`; resource
            ids and the internal selection plan are never exposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                adoptionConflict:
                  summary: Learning edition cannot be adopted
                  value:
                    code: edition_adoption_conflict
                    message: learning edition cannot be adopted
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        "500":
          description: >
            Typed repository/internal failure, including a stored adoption row
            that no longer matches the deterministic plan. `code` is
            `package_lifecycle_failed`, the public message is `local package
            lifecycle operation failed`, and `retryable` is `true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                lifecycleFailed:
                  summary: Local package lifecycle failure
                  value:
                    code: package_lifecycle_failed
                    message: local package lifecycle operation failed
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: true
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/material:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: resolveLearningMaterialForMedia
      description: >
        Resolves the learning material bound to a media source, with the
        material's actual current revision and shape. Media registration
        creates or resolves one deterministic material graph, so registered
        media resolve immediately. A media source with no bound material — and
        an unknown media id — is a typed not-found. Material assets never
        expose a media path.
      responses:
        "200":
          description: The learning material bound to the media source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetails"
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/composition:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      operationId: readMaterialComposition
      description: >
        Resolves the current adopted composition of a Material: exactly the
        selected resources and renditions of the current adoption, with their
        exact digest/size facts and Source Asset / Media bindings. This is the
        single Core-owned composition interface; the App never re-parses a
        `.listenpkg` to read adopted content. No local path, manifest, or raw
        provider output is ever exposed. A Material with no adopted composition
        is a typed not-found.
      responses:
        "200":
          description: The resolved adopted composition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptedComposition"
        "404":
          description: >
            Typed not-found: unknown material or a Material with no adopted
            composition. `code` is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  summary: Unknown material or no adopted composition
                  value:
                    code: not_found
                    message: adopted composition was not found
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        "500":
          description: >
            Typed integrity failure: the adoption or its stored backing is
            inconsistent. `code` is `composition_integrity_failure`, the
            public message is `adopted composition content is missing or fails
            integrity verification`, and `retryable` is `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                integrityFailure:
                  summary: Adopted composition integrity failure
                  value:
                    code: composition_integrity_failure
                    message: adopted composition content is missing or fails integrity verification
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        default:
          $ref: "#/components/responses/Error"
  /v1/materials/{material_id}/composition/resources/{resource_id}/payload:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
      - in: path
        name: resource_id
        required: true
        schema: { type: string }
    get:
      operationId: readCompositionResourcePayload
      description: >
        Reads the exact durable payload bytes of one selected resource of the
        adopted composition, re-verified by Core. Resource payloads are JSON
        documents (`application/json`). Missing or tampered selected content is
        an explicit `composition_integrity_failure`, never a silent fallback; a
        resource not selected by the adoption is a typed not-found.
      responses:
        "200":
          description: The exact payload bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: >
            Typed not-found: unknown material, no adopted composition, or a
            resource not selected by the adoption. `code` is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            Typed integrity failure: the selected payload is missing or its
            bytes no longer verify. `code` is `composition_integrity_failure`,
            the public message is `adopted composition content is missing or
            fails integrity verification`, and `retryable` is `false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                integrityFailure:
                  summary: Adopted composition integrity failure
                  value:
                    code: composition_integrity_failure
                    message: adopted composition content is missing or fails integrity verification
                    correlation_id: "00000000-0000-0000-0000-000000000000"
                    retryable: false
        default:
          $ref: "#/components/responses/Error"
  /v1/source-identities/mappings:
    post:
      operationId: registerSourceIdentityMapping
      description: >
        Records (or updates) the mapping of a discovered item's source-scoped
        canonical key to an exact Material Revision. Feed GUIDs, URLs, enclosure
        URLs, file hashes, and titles are typed evidence fields; the canonical
        `source_id` + `item_id` key is the only match identity. The referenced
        material and revision must exist. No response exposes a path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSourceIdentityMappingRequest"
      responses:
        "200":
          description: The recorded mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceIdentityMapping"
        default:
          $ref: "#/components/responses/Error"
  /v1/source-identities/resolve:
    get:
      operationId: resolveSourceIdentity
      description: >
        Resolves a discovered item's canonical key to its recorded mapping, or
        a typed not-found. Query parameters: `source_id`, `item_id`.
      parameters:
        - in: query
          name: source_id
          required: true
          schema: { type: string }
        - in: query
          name: item_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The recorded mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceIdentityMapping"
        default:
          $ref: "#/components/responses/Error"
  /v1/source-identities/{source_id}/items/{item_id}:
    parameters:
      - in: path
        name: source_id
        required: true
        schema: { type: string }
      - in: path
        name: item_id
        required: true
        schema: { type: string }
    get:
      operationId: resolveSourceIdentityPath
      description: >
        Path form of the canonical-key resolution, kept for typed resource
        navigation. A missing mapping is a typed not-found.
      responses:
        "200":
          description: The recorded mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceIdentityMapping"
        default:
          $ref: "#/components/responses/Error"
