  /v1/llm/providers:
    get:
      operationId: listLlmProviders
      description: >
        Lists configured vendor-neutral LLM provider profiles. Responses never
        include secrets or the opaque keychain reference — only has_credential.
      responses:
        "200":
          description: Provider profiles (secret-free views)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LlmProviderProfileView" }
    post:
      operationId: registerLlmProvider
      description: >
        Registers or updates a provider profile. The optional secret is
        write-only: it is stored in the OS keychain and never returned, logged,
        or persisted to SQLite. Identity is the (adapter, base_url, model) tuple.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterLlmProvider" }
      responses:
        "200":
          description: Saved provider profile (secret-free view)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProviderProfileView" }
  /v1/llm/providers/{id}:
    get:
      operationId: getLlmProvider
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Provider profile (secret-free view)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProviderProfileView" }
        "404":
          description: Provider profile not found
    delete:
      operationId: deleteLlmProvider
      description: >
        Deletes a provider profile and removes its credential from the secure
        store, so disabling a provider leaves no key behind.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /v1/llm/providers/{id}/probe:
    post:
      operationId: probeLlmProvider
      description: >
        Connectivity and capability test. Actually exercises structured output
        against the endpoint (protocol compatibility is not capability
        equivalence). Diagnostic only — not learning feedback.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Measured capability
          content:
            application/json:
              schema:
                type: object
                required: [structured_output]
                properties:
                  structured_output: { $ref: "#/components/schemas/CapabilityClaim" }
  /v1/llm/providers/{id}/sense-groups:
    post:
      operationId: generateSenseGroupsViaLlmProvider
      description: >
        Generates and persists a hybrid SenseGroup analysis for one subtitle
        track. The provider returns boundary token indices only. The server
        validates ordering, complete token coverage, protected lexical spans,
        and safety length; an invalid or failed sentence falls back to the
        deterministic partitioner without coupling SenseGroup to the prosody
        or word-timeline resource families.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id, track_id]
              properties:
                batch_id:
                  type: string
                  description: Client-owned identifier used for progress and cancellation.
                track_id: { type: string }
                status:
                  anyOf:
                    - $ref: "#/components/schemas/TimelineStatus"
                    - type: "null"
      responses:
        "200":
          description: Persisted hybrid SenseGroup analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SenseGroupAnalysis" }
  /v1/llm/batches/{batch_id}:
    get:
      operationId: getLlmBatchProgress
      parameters:
        - name: batch_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current or terminal LLM batch progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmBatchProgress" }
        "404": { description: Unknown batch identifier }
  /v1/llm/batches/{batch_id}/cancel:
