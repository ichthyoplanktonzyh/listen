  /v1/coach/dashboard:
    get:
      operationId: coachDashboard
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 7 } }
      responses:
        "200":
          description: Read-only diagnostic dashboard with channel-ready availability and traceable suggestions
          content:
            application/json:
              schema:
                type: object
                required: [period_start_ms, period_end_ms, generated_at_ms, channels, suggestions, starter_checklist, materials]
                properties:
                  period_start_ms: { type: integer, minimum: 0 }
                  period_end_ms: { type: integer, minimum: 0 }
                  generated_at_ms: { type: integer, minimum: 0 }
                  channels:
                    type: array
                    items:
                      type: object
                      required: [channel, status, metrics]
                      properties:
                        channel: { enum: [listening, reading, speaking, writing] }
                        status: { enum: [available, unassessed] }
                        unavailable_reason: { type: string }
                        metrics:
                          type: array
                          items:
                            type: object
                            required: [key, value, source]
                            properties:
                              key: { type: string }
                              value: { type: integer, minimum: 0 }
                              source: { type: string }
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [kind, title_key, reason_key, action, evidence_source, evidence_count]
                      properties:
                        kind: { type: string }
                        title_key: { type: string }
                        reason_key: { type: string }
                        action: { type: string }
                        evidence_source: { type: string }
                        evidence_count: { type: integer, minimum: 0 }
                  starter_checklist:
                    type: array
                    items: { type: string }
                  materials:
                    type: array
                    items:
                      type: object
                      required: [media_id, title, report_count, reports_understood_all, reports_got_the_gist, reports_unclear, practice_attempts, practice_correct, graduation_candidate]
                      properties:
                        media_id: { type: string }
                        title: { type: string }
                        report_count: { type: integer, minimum: 0 }
                        first_report: { type: [string, "null"] }
                        latest_report: { type: [string, "null"] }
                        reports_understood_all: { type: integer, minimum: 0 }
                        reports_got_the_gist: { type: integer, minimum: 0 }
                        reports_unclear: { type: integer, minimum: 0 }
                        practice_attempts: { type: integer, minimum: 0 }
                        practice_correct: { type: integer, minimum: 0 }
                        triage_intent: { type: [string, "null"] }
                        graduation_candidate: { type: boolean }
                        recommended_intent: { type: [string, "null"], enum: [pin_extensive, pin_intensive, null] }
  /v1/coach/materials/{media_id}/graduate:
    post:
      operationId: graduateCoachMaterial
      parameters:
        - { name: media_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: User-confirmed graduated material library entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaLibraryEntry" }
  /v1/coach/evidence:
    get:
      operationId: coachEvidence
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 7 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Paginated durable source facts for one dashboard metric
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, occurred_at_ms, result]
                  properties:
                    id: { type: string }
                    occurred_at_ms: { type: integer, minimum: 0 }
                    result: { type: string }
  /v1/reading/positions/{track_id}:
    get:
      operationId: readingPosition
      description: >
        Phase 3.13 reading cursor: one overwritable row per subtitle track.
        Deliberately not append-only — the position is a cursor, not
        evidence; reading history lives in the semantic-task family.
      parameters:
        - name: track_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The saved reading position, or null when never saved.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ReadingPosition" }
                  - { type: "null" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: saveReadingPosition
      parameters:
        - name: track_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anchor_cue_id, paragraph_index]
              properties:
                media_id:
                  type: [string, "null"]
                anchor_cue_id:
                  type: string
                  description: First cue id of the paragraph the reader is at.
                paragraph_index:
                  type: integer
                  minimum: 0
                  description: Display hint; anchor_cue_id is the durable key.
      responses:
        "200":
          description: The upserted reading position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingPosition" }
        default:
          $ref: "#/components/responses/Error"
  /v1/semantic/rubrics:
    post:
      operationId: createSemanticRubric
      description: >
        Phase 3.11 semantic task fact layer (ADR 0021). Append-only: rubric
        revisions POST a higher version, never rewriting an earlier one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, source, response_language, points, provenance]
              properties:
                purpose: { $ref: "#/components/schemas/SemanticTaskKind" }
                source: { $ref: "#/components/schemas/RubricSource" }
                response_language: { type: string }
                points:
                  type: array
                  items: { $ref: "#/components/schemas/RubricPoint" }
                version: { type: integer, minimum: 1, default: 1 }
                provenance: { $ref: "#/components/schemas/SemanticGeneratorProvenance" }
                revision: { $ref: "#/components/schemas/RubricRevisionNote" }
      responses:
        "200":
          description: Persisted rubric version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticRubric" }
  /v1/reading/markings:
    post:
      operationId: recordReadingMarking
      description: >
        Explicit reading-posture word marking (Phase 3.13): one user act on
        one word writes one reading-channel observation. Assistance records
        whether a translation was visible. Paragraph task results never
        write word-level observations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lexical_entry_id, surface_form, translation_visible, understood]
              properties:
                lexical_entry_id: { type: string }
                sentence_id: { type: [string, "null"] }
                surface_form: { type: string }
                media_id: { type: [string, "null"] }
                translation_visible: { type: boolean }
                understood: { type: boolean }
      responses:
        "204":
          description: Observation appended (idempotent on identical replay).
        default:
          $ref: "#/components/responses/Error"
  /v1/semantic/rubrics/lookup:
    get:
      operationId: lookupSemanticRubric
      description: >
        Read-side rubric lookup by source identity (Phase 3.13). Returns the
        latest version matching the segment, purpose, response language, and
        source snapshot hash, or null — clients cannot re-derive the
        server-minted fingerprint id.
      parameters:
        - { name: media_id, in: query, schema: { type: string } }
        - {
            name: start_ms,
            in: query,
            required: true,
            schema: { type: integer, minimum: 0 },
          }
        - {
            name: end_ms,
            in: query,
            required: true,
            schema: { type: integer, minimum: 0 },
          }
        - {
            name: purpose,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/SemanticTaskKind" },
          }
        - {
            name: response_language,
            in: query,
            required: true,
            schema: { type: string },
          }
        - {
            name: source_sha256,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          description: The latest matching rubric, or null.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SemanticRubric" }
                  - { type: "null" }
        default:
          $ref: "#/components/responses/Error"
  /v1/semantic/rubrics/{id}:
    get:
      operationId: semanticRubric
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Requested (or latest) rubric version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticRubric" }
  /v1/semantic/rubrics/{id}/attempts:
    get:
      operationId: semanticRubricAttempts
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Attempts recorded against this rubric, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticTaskAttempt" }
  /v1/semantic/attempts:
    post:
      operationId: createSemanticAttempt
      description: >
        Records a finished clip-level attempt. The attempt only completes or is
        abandoned; per-point outcome lives in a separate judgment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target, rubric_id, rubric_version, conditions, responses, status, started_at_ms]
              properties:
                kind: { $ref: "#/components/schemas/SemanticTaskKind" }
                target: { $ref: "#/components/schemas/PracticeTarget" }
                anchors:
                  type: array
                  items: { $ref: "#/components/schemas/PracticeAnchor" }
                rubric_id: { type: string }
                rubric_version: { type: integer, minimum: 1 }
                conditions: { $ref: "#/components/schemas/SemanticTaskConditions" }
                responses:
                  type: array
                  items: { $ref: "#/components/schemas/AttemptResponse" }
                status: { $ref: "#/components/schemas/SemanticAttemptStatus" }
                started_at_ms: { type: integer, minimum: 0 }
                ended_at_ms: { type: [integer, "null"], minimum: 0 }
      responses:
        "200":
          description: Persisted semantic task attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticTaskAttempt" }
  /v1/semantic/attempts/{id}:
    get:
      operationId: semanticAttempt
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One semantic task attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticTaskAttempt" }
  /v1/semantic/writing-drafts/{id}:
    get:
      operationId: writingDraft
      description: Reads mutable crash-recovery text for a rubric; this projection is not learning evidence.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Draft or null
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/WritingDraft" }
                  - { type: "null" }
    put:
      operationId: saveWritingDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt_snapshot, transcript]
              properties:
                prompt_snapshot: { type: string, minLength: 1 }
                transcript: { type: string, minLength: 1 }
      responses:
        "200":
          description: Saved scratch projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WritingDraft" }
    delete:
      operationId: deleteWritingDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Draft removed }
  /v1/semantic/attempts/{id}/writing-findings:
    get:
      operationId: writingFindings
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Append-only feedback findings for one writing attempt
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WritingFeedbackFinding" }
    post:
      operationId: createWritingFinding
      description: Records a provider finding against one exact learner revision without changing learner text.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_revision, layer, severity, message, provenance]
              properties:
                response_revision: { type: integer, minimum: 1 }
                layer: { $ref: "#/components/schemas/WritingFeedbackLayer" }
                severity: { $ref: "#/components/schemas/WritingFindingSeverity" }
                source_span: { $ref: "#/components/schemas/WritingSourceSpan" }
                message: { type: string, minLength: 1 }
                suggested_replacement: { type: [string, "null"] }
                provenance: { $ref: "#/components/schemas/WritingFeedbackProvenance" }
      responses:
        "200":
          description: Persisted writing feedback finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WritingFeedbackFinding" }
  /v1/semantic/attempts/{id}/writing-findings/local:
    post:
      operationId: generateLocalWritingFindings
      description: Runs the bundled offline rule checker only after an explicit learner request and appends revision-bound heuristic findings.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_revision]
              properties:
                response_revision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Persisted local findings, possibly empty
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WritingFeedbackFinding" }
  /v1/semantic/attempts/{id}/speaking-targets:
    post:
      operationId: confirmSpeakingTarget
      description: User confirms a literal lexical target produced in a completed constructed-speaking response.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lexical_entry_id, surface_form, sentence_id]
              properties:
                lexical_entry_id: { type: string }
                surface_form: { type: string, minLength: 1 }
                sentence_id: { type: [string, "null"] }
      responses:
        "204": { description: Idempotent speaking observation appended }
  /v1/semantic/attempts/{id}/judgments:
    get:
      operationId: semanticAttemptJudgments
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Judgments over this attempt's responses, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SemanticJudgment" }
  /v1/semantic/judgments:
    post:
      operationId: createSemanticJudgment
      description: >
        Records one per-point (or abstaining) judgment over one response
        revision. Absent or failed evaluation is never synthesized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, response_revision, rubric_id, rubric_version, rubric_source_sha256, response_transcript_sha256, provenance, evidence_class]
              properties:
                attempt_id: { type: string }
                response_revision: { type: integer, minimum: 1 }
                rubric_id: { type: string }
                rubric_version: { type: integer, minimum: 1 }
                rubric_source_sha256: { type: string }
                response_transcript_sha256: { type: string }
                points:
                  type: array
                  items: { $ref: "#/components/schemas/PointJudgment" }
                abstain: { $ref: "#/components/schemas/JudgmentAbstain" }
                provenance: { $ref: "#/components/schemas/SemanticGeneratorProvenance" }
                raw_output: {}
                evidence_class: { type: string }
      responses:
        "200":
          description: Persisted judgment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticJudgment" }
  /v1/semantic/judgments/{id}/adjudications:
    get:
      operationId: semanticJudgmentAdjudications
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: User adjudications of this judgment, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JudgmentAdjudication" }
  /v1/semantic/adjudications:
    post:
      operationId: createJudgmentAdjudication
      description: >
        User confirms or corrects one judged point. This is an adjudication of
        one automatic assertion, not a capability override; the original
        judgment stays byte-identical.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [judgment_id, point_id, prior_verdict, user_verdict]
              properties:
                judgment_id: { type: string }
                point_id: { type: string }
                prior_verdict: { $ref: "#/components/schemas/PointVerdict" }
                user_verdict: { $ref: "#/components/schemas/PointVerdict" }
                note: { type: [string, "null"] }
      responses:
        "200":
          description: Persisted adjudication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JudgmentAdjudication" }
  /v1/semantic/writing-findings/{id}/dispositions:
    get:
      operationId: writingFindingDispositions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Append-only learner decisions for one writing finding
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WritingFindingDisposition" }
    post:
      operationId: createWritingFindingDisposition
      description: Records accept/reject; acceptance cites a new immutable attempt with a later learner revision and never applies provider text.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { $ref: "#/components/schemas/WritingFindingDecision" }
                resulting_attempt_id: { type: [string, "null"] }
                resulting_response_revision: { type: [integer, "null"], minimum: 1 }
                note: { type: [string, "null"] }
      responses:
        "200":
          description: Persisted writing finding disposition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WritingFindingDisposition" }
  /v1/llm/providers:
    get:
      operationId: listLlmProviders
      description: >
        Lists configured vendor-neutral LLM provider profiles. Responses never
        include secrets or the opaque keychain reference — only has_credential.
      responses:
        "200":
          description: Provider profiles (secret-free views)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LlmProviderProfileView" }
    post:
      operationId: registerLlmProvider
      description: >
        Registers or updates a provider profile. The optional secret is
        write-only: it is stored in the OS keychain and never returned, logged,
        or persisted to SQLite. Identity is the (adapter, base_url, model) tuple.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterLlmProvider" }
      responses:
        "200":
          description: Saved provider profile (secret-free view)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProviderProfileView" }
  /v1/llm/providers/{id}:
    get:
      operationId: getLlmProvider
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Provider profile (secret-free view)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProviderProfileView" }
        "404":
          description: Provider profile not found
    delete:
      operationId: deleteLlmProvider
      description: >
        Deletes a provider profile and removes its credential from the secure
        store, so disabling a provider leaves no key behind.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /v1/llm/providers/{id}/probe:
    post:
      operationId: probeLlmProvider
      description: >
        Connectivity and capability test. Actually exercises structured output
        against the endpoint (protocol compatibility is not capability
        equivalence). Diagnostic only — not learning feedback.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Measured capability
          content:
            application/json:
              schema:
                type: object
                required: [structured_output]
                properties:
                  structured_output: { $ref: "#/components/schemas/CapabilityClaim" }
  /v1/llm/providers/{id}/judge:
    post:
      operationId: judgeViaLlmProvider
      description: >
        Judges one stored attempt through the provider and records the result as
        an unqualified heuristic_proxy judgment (no observation/projection, no
        learning surface until Phase 3.12.1). On any provider error nothing is
        written and a standardized, secret-free error is returned.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, response_revision]
              properties:
                attempt_id: { type: string }
                response_revision: { type: integer }
      responses:
        "200":
          description: Recorded judgment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticJudgment" }
  /v1/hunting/candidates:
    get:
      operationId: listHuntingCandidates
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/HuntingCandidateStatus" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 0 } }
