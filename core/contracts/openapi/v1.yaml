        limit_status: { $ref: "#/components/schemas/ReviewLimitStatus" }
    CustomStudyRequest:
      type: object
      required: [kind]
      description: A read-only listening review queue filtered by new cards, upcoming reviews, or forgotten cards.
      properties:
        kind: { type: string, enum: [more_new, review_ahead, forgotten] }
        minimum_lapses: { type: [integer, "null"], minimum: 1 }
        limit: { type: [integer, "null"], minimum: 1, maximum: 100 }
        at_ms: { type: [integer, "null"], minimum: 0 }
    CustomStudyQueue:
      type: object
      required: [entries, advances_normal_schedule]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/ReviewQueueEntry" } }
        advances_normal_schedule: { type: boolean }
    SubmitCustomStudyAttempt:
      type: object
      required: [item_id, rating, kind]
      properties:
        item_id: { type: string }
        rating: { $ref: "#/components/schemas/ReviewRating" }
        kind: { type: string, enum: [more_new, review_ahead, forgotten] }
        minimum_lapses: { type: [integer, "null"], minimum: 1 }
    SubmitReviewAttempt:
      type: object
      required: [item_id, rating]
      properties:
        item_id: { type: string }
        rating: { $ref: "#/components/schemas/ReviewRating" }
    ReviewSubmission:
      type: object
      required: [attempt, schedule, generated_observation_ids, hunting_candidate_ids, upgrade_suggestions]
      properties:
        attempt: { $ref: "#/components/schemas/ReviewAttempt" }
        schedule: { $ref: "#/components/schemas/ReviewSchedule" }
        generated_observation_ids: { type: array, items: { type: string } }
        hunting_candidate_ids: { type: array, items: { type: string } }
        upgrade_suggestions: { type: array, items: { $ref: "#/components/schemas/UpgradeSuggestion" } }
    HuntingTargetSourceKind:
      type: string
      enum: [manual, review_candidate, listening_inbox]
    HuntingTargetStatus:
      type: string
      enum: [active, archived]
    CreateHuntingTargetInput:
      type: object
      required: [lexical_entry_id, source_kind]
      properties:
        lexical_entry_id: { type: string }
        source_kind: { $ref: "#/components/schemas/HuntingTargetSourceKind" }
        source_id: { type: [string, "null"] }
    HuntingTarget:
      type: object
      required: [id, lexical_entry_id, source_kind, source_id, target_snapshot, status, created_at_ms, updated_at_ms]
      properties:
        id: { type: string }
        lexical_entry_id: { type: string }
        source_kind: { $ref: "#/components/schemas/HuntingTargetSourceKind" }
        source_id: { type: [string, "null"] }
        target_snapshot: { type: string }
        status: { $ref: "#/components/schemas/HuntingTargetStatus" }
        created_at_ms: { type: integer, minimum: 0 }
        updated_at_ms: { type: integer, minimum: 0 }
    HuntingOccurrence:
      type: object
      required: [target_id, lexical_entry_id, target_snapshot, occurrence]
      properties:
        target_id: { type: string }
        lexical_entry_id: { type: string }
        target_snapshot: { type: string }
        occurrence: { $ref: "#/components/schemas/CorpusOccurrence" }
    HuntingOccurrenceQueryResult:
      type: object
      required: [indexed, occurrences]
      properties:
        indexed: { type: boolean }
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/HuntingOccurrence" }
    HuntingCheckAnswer:
      type: string
      enum: [recognized, not_recognized, not_noticed]
    SubmitHuntingCheckInput:
      type: object
      required: [session_id, target_id, occurrence_id, answer]
      properties:
        session_id: { type: string }
        target_id: { type: string }
        occurrence_id: { type: string }
        answer: { $ref: "#/components/schemas/HuntingCheckAnswer" }
    HuntingCheckResult:
      type: object
      required: [answer, event_id, observation_id]
      properties:
        answer: { $ref: "#/components/schemas/HuntingCheckAnswer" }
        event_id: { type: string }
        observation_id: { type: [string, "null"] }
    LearningObservation:
      type: object
      required: [id, lexical_entry_id, sense_id, capability, task_type, outcome, assistance, surface_form, sentence_id, media_id, origin, source_ref, occurred_at_ms]
      properties:
        id: { type: string }
        lexical_entry_id: { type: string }
        sense_id: { type: [string, "null"] }
        capability: { enum: [reading, listening, speaking, writing] }
        task_type: { enum: [context_marking, cloze, dictation, subtitle_fade, review_recall, upgrade_confirmation] }
        outcome: { enum: [success, partial, failure] }
        assistance: { enum: [none, partial_text, full_text] }
        surface_form: { type: [string, "null"] }
        sentence_id: { type: [string, "null"] }
        media_id: { type: [string, "null"] }
        origin: { enum: [user_marking, practice_task, review_task, legacy_backfill] }
        source_ref: { type: [string, "null"] }
        occurred_at_ms: { type: integer, minimum: 0 }
    CompleteListeningSessionInput:
      type: object
      properties:
        comprehension_report:
          oneOf:
            - { $ref: "#/components/schemas/ListeningComprehensionReport" }
            - { type: "null" }
        hunting_summary:
          oneOf:
            - { $ref: "#/components/schemas/HuntingCompletionSummary" }
            - { type: "null" }
    HuntingCompletionSummary:
      type: object
      required: [prompted_count, recognized_count, not_recognized_count, not_noticed_count]
      properties:
        prompted_count: { type: integer, minimum: 0, maximum: 5 }
        recognized_count: { type: integer, minimum: 0, maximum: 5 }
        not_recognized_count: { type: integer, minimum: 0, maximum: 5 }
        not_noticed_count: { type: integer, minimum: 0, maximum: 5 }
    CaptureListeningInboxItemInput:
      type: object
      required: [session_id, target, anchors, subtitle_snapshot]
      properties:
        session_id: { type: string }
        target: { $ref: "#/components/schemas/PracticeTarget" }
        anchors: { type: array, items: { $ref: "#/components/schemas/PracticeAnchor" } }
        label: { type: [string, "null"] }
        subtitle_snapshot: { type: string }
        context_before: { type: [string, "null"] }
        context_after: { type: [string, "null"] }
        expires_in_days: { type: [integer, "null"], minimum: 0 }
    ProcessListeningInboxItemInput:
      type: object
      required: [resolution]
      properties:
        resolution: { $ref: "#/components/schemas/ListeningInboxResolution" }
    ListeningInboxItem:
      type: object
      required: [id, session_id, media_id, track_id, target, anchors, label, subtitle_snapshot, context_before, context_after, captured_at_ms, expires_at_ms, status, resolution, review_item_ids, practice_item_id, updated_at_ms]
      properties:
        id: { type: string }
        session_id: { type: [string, "null"] }
        media_id: { type: [string, "null"] }
        track_id: { type: [string, "null"] }
        target: { $ref: "#/components/schemas/PracticeTarget" }
        anchors: { type: array, items: { $ref: "#/components/schemas/PracticeAnchor" } }
        label: { type: [string, "null"] }
        subtitle_snapshot: { type: string }
        context_before: { type: [string, "null"] }
        context_after: { type: [string, "null"] }
        captured_at_ms: { type: integer, minimum: 0 }
        expires_at_ms: { type: [integer, "null"], minimum: 0 }
        status: { $ref: "#/components/schemas/ListeningInboxStatus" }
        resolution:
          oneOf:
            - { $ref: "#/components/schemas/ListeningInboxResolution" }
            - { type: "null" }
        review_item_ids: { type: array, items: { type: string } }
        practice_item_id: { type: [string, "null"] }
        updated_at_ms: { type: integer, minimum: 0 }
    VocabularyAssetBundle:
      type: object
      required: [version, exported_at_ms, lexical_entries, lexical_history, lexical_occurrences, lexical_observations, phonetic_finding_feedback]
      properties:
        version: { enum: [5, 6, 7] }
        exported_at_ms: { type: integer, minimum: 0 }
        lexical_entries: { type: array, items: { $ref: "#/components/schemas/LexicalEntry" } }
        lexical_history: { type: array, items: { $ref: "#/components/schemas/LexicalStatusHistory" } }
        lexical_occurrences: { type: array, items: { $ref: "#/components/schemas/LexicalOccurrence" } }
        lexical_sense_folders: { type: array, items: { $ref: "#/components/schemas/LexicalSenseFolder" } }
        lexical_sense_folder_occurrences:
          type: array
          items:
            type: object
            required: [lexical_sense_id, lexical_occurrence_id]
            properties:
              lexical_sense_id: { type: string }
              lexical_occurrence_id: { type: string }
        lexical_observations: { type: array, items: { $ref: "#/components/schemas/LexicalObservation" } }
        phonetic_finding_feedback: { type: array, items: { type: object } }
    DictionaryLookup:
      type: object
      required: [query, lemma, definitions, phonetics, provider, cached_at_ms]
      properties:
        query: { type: string }
        lemma: { type: string }
        definitions:
          type: array
          items:
            type: object
            required: [part_of_speech, text]
            properties:
              part_of_speech: { type: [string, "null"] }
              text: { type: string }
        phonetics:
          type: array
          items:
            type: object
            required: [text, region, audio_url]
            properties:
              text: { type: string }
              region: { type: [string, "null"] }
              audio_url: { type: [string, "null"] }
        provider: { type: string }
        cached_at_ms: { type: integer, minimum: 0 }
    DictionaryLookupBundle:
      type: object
      required: [query, normalized_lemma, results]
      properties:
        query: { type: string }
        normalized_lemma: { type: string }
        results:
          type: array
          items:
            type: object
            required: [provider, lookup, error]
            properties:
              provider:
                type: object
                required: [id, display_name, supported_languages, provides_definitions, provides_phonetics, provides_audio, offline]
                properties:
                  id: { type: string }
                  display_name: { type: string }
                  supported_languages: { type: array, items: { type: string } }
                  provides_definitions: { type: boolean }
                  provides_phonetics: { type: boolean }
                  provides_audio: { type: boolean }
                  offline: { type: boolean }
              lookup:
                anyOf:
                  - $ref: "#/components/schemas/DictionaryLookup"
                  - type: "null"
              error: { type: [string, "null"] }
    ExternalVocabularyImport:
      type: object
      required: [language, entries, default_status, overwrite_existing]
      properties:
        language: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [word, status]
            properties:
              word: { type: string }
              status:
                anyOf:
                  - enum: [unknown_meaning, known_not_recognized, known_recognized]
                  - type: "null"
        default_status:
          anyOf:
            - enum: [unknown_meaning, known_not_recognized, known_recognized]
            - type: "null"
        overwrite_existing: { type: boolean }
    ExternalVocabularyImportSummary:
      type: object
      required: [created, initialized, skipped, overwritten, invalid]
      properties:
        created: { type: integer, minimum: 0 }
        initialized: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        overwritten: { type: integer, minimum: 0 }
        invalid: { type: integer, minimum: 0 }
    LearnerProfileView:
      type: object
      required: [l1_language, ui_language, active_l2_language, updated_at_ms]
      properties:
        l1_language:
          type: [string, "null"]
          description: The learner's declared native language; null when never set.
        ui_language:
          type: [string, "null"]
          description: Client-reported UI-language snapshot (display/statistics only).
        active_l2_language:
          type: [string, "null"]
          description: Reserved; learning language is currently derived per subtitle track.
        updated_at_ms: { type: [integer, "null"], minimum: 0 }
    SyntacticDependencyPattern:
      type: object
      required: [matcher_key, nodes]
      properties:
        matcher_key:
          type: string
          description: Matcher-local diagnostic key; never a Construction canonical identity.
        nodes:
          type: array
          items:
            type: object
            required: [binding]
            properties:
              binding: { type: string }
              lemma: { type: [string, "null"] }
              upos: { type: [string, "null"] }
              dependency_relation: { type: [string, "null"] }
        edges:
          type: array
          items:
            type: object
            required: [head_binding, dependent_binding]
            properties:
              head_binding: { type: string }
              dependent_binding: { type: string }
              dependency_relation: { type: [string, "null"] }
    SyntacticConsumerBatch:
      type: object
      required: [qualification, probe_request_count, analysis_request_count, sentences]
      properties:
        descriptor:
          type: [object, "null"]
          description: Complete provider/runtime/model provenance when the optional capability ran.
        qualification:
          type: object
          required: [artifact, reference_b_verified_subset, sense_group, dependency_matcher]
          properties:
            artifact: { type: boolean }
            reference_b_verified_subset: { type: boolean }
            sense_group: { type: boolean }
            dependency_matcher: { type: boolean }
        probe_request_count: { type: integer, minimum: 0 }
        analysis_request_count:
          type: integer
          minimum: 0
          maximum: 1
          description: One provider batch at most; all consumers reuse its per-sentence artifacts.
        sentences:
          type: array
          items:
            type: object
            required: [sentence_id, reference_b, sense_groups, dependency_matches]
            properties:
              sentence_id: { type: string }
              analysis: { type: [object, "null"] }
              validation: { type: [object, "null"] }
              fallback_reason:
                anyOf:
                  - enum: [provider_not_configured, runtime_missing, model_missing, model_corrupt, unsupported_language, timeout, invalid_output, protocol_failure, process_failure, provider_failure, artifact_unqualified, missing_sentence, invalid_sentence]
                  - type: "null"
              reference_b:
                type: array
                items: { type: object }
              sense_groups:
                type: array
                items: { type: object }
              dependency_matches:
                type: array
                description: Rebuildable matcher candidates only; no canonical Construction or capability identity.
                items: { type: object }
    SentenceDiagnosis:
      type: object
      required: [sentence_id, hints, unclassified_lemmas]
      properties:
        sentence_id: { type: string }
        hints:
          type: array
          items:
            type: object
            required: [kind, message, lexical_entry_ids]
            properties:
              kind:
                enum: [meaning_barrier, recognition_barrier, insufficient_information, other_factors]
              message: { type: string }
              lexical_entry_ids:
                type: array
                items: { type: string }
              reasons:
                type: array
                description: Per-language listening-factor possibilities (not audio detections); empty except on a recognition barrier.
                items: { type: string }
        unclassified_lemmas:
          type: array
          items: { type: string }
        l1_hints:
          type: array
          description: L1-transfer possibilities (Phase 3.9); empty unless the learner declared an L1 with a supported (L1, L2) difficulty profile and the sentence carries replayable evidence.
          items:
            type: object
            required: [difficulty_kind, message, families, spans]
            properties:
              difficulty_kind: { type: string }
              message: { type: string }
              families:
                type: array
                items: { type: string }
              spans:
                type: array
                description: Replayable audio spans from the sentence's rhythm frame; a hint always carries at least one.
                items:
                  type: object
                  required: [family, start_ms, end_ms, label, surface_text]
                  properties:
                    family: { type: string }
                    start_ms: { type: integer, minimum: 0 }
                    end_ms: { type: integer, minimum: 0 }
                    label: { type: string }
                    surface_text: { type: string }
        l1_context:
          type: object
          description: Present only when the learner declared an L1.
          required: [l1, l2, support]
          properties:
            l1: { type: string }
            l2: { type: string }
            support:
              enum: [supported, unsupported_pair]
    Error:
      type: object
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string }
        retryable: { type: boolean }
    LearningMaterial:
      type: object
      required: [id, current_revision_id, retained_at_ms, created_at_ms, updated_at_ms]
      properties:
        id: { type: string }
        current_revision_id: { type: string }
        retained_at_ms:
          type: [integer, "null"]
          minimum: 0
          description: >
            Evidence of explicit Personal Library membership; required but
            nullable so every response states known membership. Non-null
            means the material is a library member and carries the
            deterministic membership time; null means Temporary Material
            (readable by ID and resolvable from media, but absent from the
            material library). The value is set once at first retention and
            is never silently rewritten by repeated retention, registration,
            or revision.
        created_at_ms: { type: integer, minimum: 0 }
        updated_at_ms: { type: integer, minimum: 0 }
    MaterialRevision:
      type: object
      required:
        - id
        - material_id
        - title
        - source_assets
        - media_renditions
        - created_at_ms
      properties:
        id: { type: string }
        material_id: { type: string }
        title: { type: string }
        source_assets:
          type: array
          items: { $ref: "#/components/schemas/SourceAsset" }
        media_renditions:
          type: array
          items: { $ref: "#/components/schemas/MediaRendition" }
        created_at_ms: { type: integer, minimum: 0 }
    SourceAsset:
      type: object
      required: [id, media_type, byte_length, sha256_digest, binding, availability, created_at_ms]
      properties:
        id: { type: string }
        media_type: { type: string }
        byte_length: { type: integer, minimum: 0 }
        sha256_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase hex SHA-256 of the exact source bytes.
        binding:
          $ref: "#/components/schemas/SourceAssetBinding"
        availability:
          $ref: "#/components/schemas/SourceAssetAvailability"
        created_at_ms: { type: integer, minimum: 0 }
      description: >
        A learner-authorized source evidence fact: the exact bytes of the
        original source, described without any path.
    SourceAssetBinding:
      type: object
      required: [type]
      properties:
        type: { enum: [managed, referenced] }
        reference:
          type: [string, "null"]
          description: >
            Opaque app-owned reference for a `referenced` binding. It is a fact
            about binding, never a path to dereference here.
    SourceAssetAvailability:
      type: object
      required: [state]
      properties:
        state: { enum: [available, unavailable] }
        reason:
          type: [string, "null"]
          enum: [file_missing, integrity_mismatch]
          description: Required when `state` is `unavailable`.
    SourceAssetAvailabilityInput:
      type: object
      required: [availability]
      properties:
        availability:
          $ref: "#/components/schemas/SourceAssetAvailability"
    MediaRendition:
      type: object
      required: [id, origin, kind, media_type, fingerprint, availability, media_id, media_sha256, media_byte_size]
      properties:
        id: { type: string }
        origin: { enum: [source, derived] }
        kind: { enum: [video, audio] }
        media_type: { type: string }
        fingerprint: { type: string }
        availability: { enum: [available, missing, archived] }
        media_id:
          type: [string, "null"]
          description: >
            The bound media source for a Source rendition. A media path is
            never part of a material.
        media_sha256:
          type: [string, "null"]
          description: Required for a Derived rendition.
        media_byte_size:
          type: [integer, "null"]
          minimum: 0
    MaterialDetails:
      type: object
      required: [material, current_revision, shape]
      properties:
        material: { $ref: "#/components/schemas/LearningMaterial" }
        current_revision: { $ref: "#/components/schemas/MaterialRevision" }
        shape:
          type: string
          enum: [audio, video, mixed]
          description: >
            Composition shape of the current audio/video revision.
    SourceAssetInput:
      type: object
      required: [media_type, byte_length, sha256_digest, binding]
      properties:
        media_type: { type: string, minLength: 1 }
        byte_length: { type: integer, minimum: 0 }
        sha256_digest: { type: string, minLength: 1 }
        binding:
          type: object
          required: [type]
          properties:
            type: { enum: [managed, referenced] }
            reference: { type: [string, "null"] }
      description: >
        Source Asset input: the exact byte facts. Availability is a stored
        fact that starts as available and is updated through the
        source-assets availability operation.
    MediaRenditionInput:
      type: object
      required: [media_id]
      properties:
        media_id:
          type: string
          description: Media source id of an already-registered media item.
    CreateLearningMaterial:
      type: object
      required: [title, media_renditions]
      properties:
        title: { type: string, minLength: 1 }
        source_assets:
          type: array
          default: []
          items: { $ref: "#/components/schemas/SourceAssetInput" }
        media_renditions:
          type: array
          items: { $ref: "#/components/schemas/MediaRenditionInput" }
        retain:
          type: [boolean, "null"]
          default: true
          description: >
            Personal Library membership choice. Omitted (or null) means
            retained, preserving the historical behavior for old clients.
            Explicit false creates Temporary Material: readable by ID and
            resolvable from media, but absent from the material library until
            explicitly retained. Membership evidence is set once; a later
            `retain: false` never clears existing membership.
    AppendMaterialRevision:
      type: object
      required: [title, media_renditions]
      properties:
        title: { type: string, minLength: 1 }
        source_assets:
          type: array
          default: []
          items: { $ref: "#/components/schemas/SourceAssetInput" }
        media_renditions:
          type: array
          items: { $ref: "#/components/schemas/MediaRenditionInput" }
    MaterialCapability:
      type: string
      enum: [read, listen, watch, synchronized_read_listen]
    MaterialCapabilityProjection:
      type: object
      required: [capability, status, latest_attempt]
      properties:
        capability: { $ref: "#/components/schemas/MaterialCapability" }
        status:
          enum: [available, derivable, generating, unavailable, failed_attempt]
        latest_attempt:
          type: [object, "null"]
          $ref: "#/components/schemas/CapabilityAttempt"
    CapabilityAttempt:
      type: object
      required:
        - attempt_id
        - material_id
        - capability
        - status
        - started_at_ms
        - finished_at_ms
        - failure_reason
        - producer_tool_id
        - producer_tool_version
      properties:
        attempt_id: { type: string }
        material_id: { type: string }
        capability: { $ref: "#/components/schemas/MaterialCapability" }
        status: { enum: [running, succeeded, failed, cancelled, superseded] }
        started_at_ms: { type: integer, minimum: 0 }
        finished_at_ms: { type: [integer, "null"], minimum: 0 }
        failure_reason: { type: [string, "null"] }
        producer_tool_id: { type: [string, "null"] }
        producer_tool_version: { type: [string, "null"] }
    StartCapabilityAttemptRequest:
      type: object
      required: [capability]
      properties:
        capability: { enum: [read, listen, watch, synchronized_read_listen] }
    FinalizeCapabilityAttemptRequest:
      type: object
      required: [status]
      properties:
        status: { enum: [succeeded, failed, cancelled] }
        tool_id:
          type: [string, "null"]
          description: Required when `status` is `succeeded`.
        tool_version:
          type: [string, "null"]
          description: Required when `status` is `succeeded`.
        reason:
          type: [string, "null"]
          description: Required when `status` is `failed`.
    SourceIdentityMapping:
      type: object
      required:
        - source_id
        - item_id
        - evidence
        - material_id
        - material_revision_id
        - mapped_at_ms
      properties:
        source_id: { type: string }
        item_id: { type: string }
        evidence: { $ref: "#/components/schemas/SourceItemEvidence" }
        material_id: { type: string }
        material_revision_id: { type: string }
        mapped_at_ms: { type: integer, minimum: 0 }
    SourceItemEvidence:
      type: object
      required: [enclosure_urls]
      properties:
        feed_item_id: { type: [string, "null"] }
        entry_url: { type: [string, "null"] }
        enclosure_urls:
          type: array
          items: { type: string }
        file_sha256: { type: [string, "null"] }
        title: { type: [string, "null"] }
    RegisterSourceIdentityMappingRequest:
      type: object
      required:
        - source_id
        - item_id
        - evidence
        - material_id
        - material_revision_id
        - mapped_at_ms
      properties:
        source_id: { type: string }
        item_id: { type: string }
        evidence: { $ref: "#/components/schemas/SourceItemEvidence" }
        material_id: { type: string }
        material_revision_id: { type: string }
        mapped_at_ms: { type: integer, minimum: 0 }
    InstallMaterialPackageRequest:
      type: object
      required: [package_path]
      properties:
        package_path:
          type: string
          minLength: 1
          description: >
            Local path to a Content Package v3 carrier. The path is a write-only
            input: it never appears in any response or public error text.
    AdoptLearningEditionRequest:
      type: object
      required: [release_id]
      properties:
        release_id:
          type: string
          description: The immutable `sha256:` Package Release identity to adopt.
    LearningEditionDetails:
      type: object
      required:
        - material_id
        - material_revision_id
        - edition_id
        - release_id
        - title
        - target_language
        - support_languages
        - installed_at_ms
        - adopted_at_ms
        - adopted
        - available_capabilities
        - resources
        - renditions
      properties:
        material_id: { type: string }
        material_revision_id: { type: string }
        edition_id: { type: string }
        release_id: { type: string }
        title: { type: string }
        target_language: { type: string }
        support_languages:
          type: array
          items: { type: string }
        installed_at_ms: { type: integer, minimum: 0 }
        adopted_at_ms:
          type: [integer, "null"]
          minimum: 0
          description: >
            Required but nullable adoption evidence: the original adoption
            time when this release is currently adopted, null otherwise.
        adopted: { type: boolean }
        available_capabilities:
          type: array
          items: { $ref: "#/components/schemas/MaterialCapability" }
        resources:
          type: array
          items: { $ref: "#/components/schemas/LearningEditionResource" }
        renditions:
          type: array
          items: { $ref: "#/components/schemas/LearningEditionRendition" }
    LearningEditionResource:
      type: object
      required:
        - resource_id
        - kind
        - role
        - required
        - availability
        - review_status
        - content_language
        - support_languages
      properties:
        resource_id: { type: string }
        kind: { type: string }
        role: { enum: [base, assistance] }
        required: { type: boolean }
        availability: { enum: [available, missing, opaque] }
        review_status: { enum: [unreviewed, machine_checked, human_reviewed] }
        content_language:
          type: [string, "null"]
          description: Required but nullable content-language tag.
        support_languages:
          type: array
          items: { type: string }
    LearningEditionRendition:
      type: object
      required: [rendition_id, kind, available]
      properties:
        rendition_id: { type: string }
        kind: { type: string }
        available: { type: boolean }
    AdoptedComposition:
      type: object
      required:
        - material_id
        - material_revision_id
        - release_id
        - edition_id
        - title
        - target_language
        - support_languages
        - adopted_at_ms
        - resources
        - renditions
      properties:
        material_id: { type: string }
        material_revision_id: { type: string }
        release_id: { type: string }
        edition_id: { type: string }
        title: { type: string }
        target_language: { type: string }
        support_languages:
          type: array
          items: { type: string }
        adopted_at_ms: { type: integer, minimum: 0 }
        resources:
          type: array
          items: { $ref: "#/components/schemas/CompositionResource" }
        renditions:
          type: array
          items: { $ref: "#/components/schemas/CompositionRendition" }
      description: >
        The resolved current adopted composition of a Material: exactly the
        selected resources and renditions of the current adoption, with their
        exact digest/size facts and Source Asset / Media bindings. No local
        path, manifest, or raw provider output is ever exposed.
    CompositionResource:
      type: object
      required:
        - resource_id
        - kind
        - schema
        - role
        - required
        - availability
        - content_language
        - support_languages
        - payload_digest
        - payload_size_bytes
        - review_status
      properties:
        resource_id: { type: string }
        kind: { type: string }
        schema: { type: string }
        role: { enum: [base, assistance] }
        required: { type: boolean }
        availability: { enum: [available, missing, opaque] }
        content_language:
          type: [string, "null"]
          description: Required but nullable content-language tag.
        support_languages:
          type: array
          items: { type: string }
        payload_digest:
          type: string
          description: Exact digest fact of the durable payload bytes.
        payload_size_bytes: { type: integer, minimum: 0 }
        review_status: { enum: [unreviewed, machine_checked, human_reviewed] }
    CompositionRendition:
      type: object
      required:
        - rendition_id
        - kind
        - origin
        - media_type
        - digest
        - byte_size
        - blob_available
        - binding
        - producer_tool_id
      properties:
        rendition_id: { type: string }
        kind: { type: string }
        origin: { enum: [source, derived] }
        media_type: { type: string }
        digest:
          type: string
          description: Lowercase hex SHA-256 of the exact rendition bytes.
        byte_size: { type: integer, minimum: 0 }
        blob_available: { type: boolean }
        binding:
          type: [object, "null"]
          $ref: "#/components/schemas/CompositionBinding"
        producer_tool_id:
          type: [string, "null"]
          description: Required but nullable producer tool identity for a Derived rendition.
    CompositionBinding:
      type: object
      required: [type]
      properties:
        type: { const: media }
        media_id:
          type: string
          description: The bound media source for a Source media rendition.
      description: >
        The media binding behind a rendition. A local path is never part of a
        binding.

    FitSignal:
      type: object
      required: [kind, value, decisive]
      properties:
        kind:
          type: string
          enum: [unknown_meaning_density, unassessed_density, known_not_recognized_density,
                 speech_rate_wpm, weak_form_density, compression_density, mean_chunk_length,
                 comprehension_report_unclear_ratio, practice_correct_rate,
                 mean_sense_group_length, sense_group_density, multi_word_expression_density,
                 unknown_phrase_density, unassessed_phrase_density, syntax_depth,
                 mean_dependency_span, pause_ratio, replay_density, lookup_density,
                 subtitle_timing_quality]
        value: { type: number, format: float }
        # True when this signal selected or escalated the band (vs informational).
        decisive: { type: boolean }
        contribution:
          type: number
          format: float
          minimum: -1
          maximum: 1
    DifficultyDimension:
      type: object
      required: [fit, signals]
      properties:
        fit: { type: string, enum: [too_easy, comprehensible, challenging, too_hard] }
        signals:
          type: array
          items: { $ref: "#/components/schemas/FitSignal" }
        score: { type: number, format: float, minimum: 0, maximum: 1 }
    ContentDifficultyProfile:
      type: object
      required: [subject_kind, subject_id, language, meaning, sound,
                 assessed_token_ratio, evidence_grade, algorithm_version,
                 computed_at_ms, input_fingerprint]
      properties:
        # "media" today; "sentence" is a reserved seam (ADR 0018 decision 5).
        subject_kind: { type: string }
        subject_id: { type: string }
        language: { type: string }
        meaning: { $ref: "#/components/schemas/DifficultyDimension" }
        sound: { $ref: "#/components/schemas/DifficultyDimension" }
        # Share of word tokens with any vocabulary assessment; below the
        # honesty threshold the UI must show the degraded-estimate state.
        assessed_token_ratio: { type: number, format: float, minimum: 0, maximum: 1 }
        evidence_grade: { type: string, enum: [initial_estimate, usage_calibrated] }
        algorithm_version: { type: string }
        computed_at_ms: { type: integer }
        input_fingerprint: { type: string }
        feature_snapshot: { $ref: "#/components/schemas/ContentFitFeatureSnapshot" }
        feature_coverage: { $ref: "#/components/schemas/FeatureCoverage" }
    ContentFitFeatureSnapshot:
      type: object
      required: [unknown_meaning_density, unassessed_density,
                 known_not_recognized_density, speech_rate_wpm,
                 weak_form_density, compression_density, mean_chunk_length,
                 mean_sense_group_length, sense_group_density,
                 multi_word_expression_density, unknown_phrase_density,
                 unassessed_phrase_density, syntax_depth, mean_dependency_span,
                 pause_ratio, replay_density, lookup_density,
                 subtitle_timing_quality, assessed_token_ratio]
      properties:
        unknown_meaning_density: { type: number, format: float, minimum: 0, maximum: 1 }
        unassessed_density: { type: number, format: float, minimum: 0, maximum: 1 }
        known_not_recognized_density: { type: number, format: float, minimum: 0, maximum: 1 }
        speech_rate_wpm: { type: [number, "null"], format: float, minimum: 0 }
        weak_form_density: { type: [number, "null"], format: float, minimum: 0 }
        compression_density: { type: [number, "null"], format: float, minimum: 0 }
        mean_chunk_length: { type: [number, "null"], format: float, minimum: 0 }
        mean_sense_group_length: { type: [number, "null"], format: float, minimum: 0 }
        sense_group_density: { type: [number, "null"], format: float, minimum: 0 }
        multi_word_expression_density: { type: [number, "null"], format: float, minimum: 0 }
        unknown_phrase_density: { type: [number, "null"], format: float, minimum: 0, maximum: 1 }
        unassessed_phrase_density: { type: [number, "null"], format: float, minimum: 0, maximum: 1 }
        syntax_depth: { type: [number, "null"], format: float, minimum: 0 }
        mean_dependency_span: { type: [number, "null"], format: float, minimum: 0 }
        pause_ratio: { type: [number, "null"], format: float, minimum: 0 }
        replay_density: { type: [number, "null"], format: float, minimum: 0 }
        lookup_density: { type: [number, "null"], format: float, minimum: 0 }
        subtitle_timing_quality: { type: [number, "null"], format: float, minimum: 0, maximum: 1 }
        assessed_token_ratio: { type: number, format: float, minimum: 0, maximum: 1 }
    FeatureCoverage:
      type: object
      required: [total_features, available_features, coverage_ratio, missing_features]
      properties:
        total_features: { type: integer, minimum: 0 }
        available_features: { type: integer, minimum: 0 }
        coverage_ratio: { type: number, format: float, minimum: 0, maximum: 1 }
        missing_features:
          type: array
          items:
            type: string
            enum: [speech_rate_wpm, weak_form_density, compression_density,
                   mean_chunk_length, mean_sense_group_length, sense_group_density,
                   multi_word_expression_density, unknown_phrase_density,
                   unassessed_phrase_density, syntax_depth, mean_dependency_span,
                   pause_ratio, replay_density, lookup_density,
                   subtitle_timing_quality]
    CalibrationSample:
      type: object
      required: [subject_kind, subject_id, language, snapshot,
                 predicted_meaning_score, predicted_sound_score,
                 predicted_meaning_band, predicted_sound_band,
                 v2_meaning_band, v2_sound_band, observed_difficulty,
                 reports_understood_all, reports_got_the_gist,
                 reports_unclear, practice_attempts, practice_correct,
                 sampled_at_ms]
      properties:
        subject_kind: { type: string }
        subject_id: { type: string }
        language: { type: string }
        snapshot: { $ref: "#/components/schemas/ContentFitFeatureSnapshot" }
        predicted_meaning_score: { type: number, format: float, minimum: 0, maximum: 1 }
        predicted_sound_score: { type: number, format: float, minimum: 0, maximum: 1 }
        predicted_meaning_band: { type: string, enum: [too_easy, comprehensible, challenging, too_hard] }
        predicted_sound_band: { type: string, enum: [too_easy, comprehensible, challenging, too_hard] }
        v2_meaning_band: { type: string, enum: [too_easy, comprehensible, challenging, too_hard] }
        v2_sound_band: { type: string, enum: [too_easy, comprehensible, challenging, too_hard] }
        observed_difficulty: { type: [number, "null"], format: float, minimum: 0, maximum: 1 }
        reports_understood_all: { type: integer, minimum: 0 }
        reports_got_the_gist: { type: integer, minimum: 0 }
        reports_unclear: { type: integer, minimum: 0 }
        practice_attempts: { type: integer, minimum: 0 }
        practice_correct: { type: integer, minimum: 0 }
        sampled_at_ms: { type: integer, minimum: 0 }
    ProjectionEvidenceRef:
      type: object
      required: [observation_id, source_ref, task_type, outcome, occurred_at_ms, snapshot]
      properties:
        observation_id: { type: string }
        source_ref: { type: [string, "null"] }
        task_type: { type: string }
        outcome: { type: string, enum: [success, partial, failure] }
        occurred_at_ms: { type: integer, minimum: 0 }
        snapshot: { type: string }
    ProjectionProposal:
      type: object
      required: [id, lexical_entry_id, capability, proposed_conclusion, algorithm_version, confidence, evidence_as_of_ms, evidence, rationale, status, created_at_ms]
      properties:
        id: { type: string }
        lexical_entry_id: { type: string }
        capability: { const: listening }
        proposed_conclusion: { type: string, enum: [not_acquired, acquired] }
        algorithm_version: { type: string }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        evidence_as_of_ms: { type: integer, minimum: 0 }
        evidence: { type: array, items: { $ref: "#/components/schemas/ProjectionEvidenceRef" } }
        rationale: { type: string }
        status: { type: string, enum: [pending, confirmed, rejected, superseded] }
        created_at_ms: { type: integer, minimum: 0 }
    ChannelQualificationReport:
      type: object
      required: [capability, qualification, algorithm_version, qualifying_evidence_count, reason]
      properties:
        capability: { const: listening }
        qualification: { type: string, enum: [qualified, insufficient_evidence] }
        algorithm_version: { type: string }
        qualifying_evidence_count: { type: integer, minimum: 0 }
        reason: { type: string }
    ProjectionAudit:
      type: object
      required: [lexical_entry_id, reports, proposals]
      properties:
        lexical_entry_id: { type: string }
        reports: { type: array, items: { $ref: "#/components/schemas/ChannelQualificationReport" } }
        proposals: { type: array, items: { $ref: "#/components/schemas/ProjectionProposal" } }
    HuntingCandidateStatus:
      type: string
      enum: [active, consumed, dismissed]
    HuntingCandidate:
      type: object
      required: [id, lexical_entry_id, review_item_id, sentence_id, media_id, track_id, target_snapshot, prompt_snapshot, failure_count, status, created_at_ms, last_failed_at_ms]
      properties:
        id: { type: string }
        lexical_entry_id: { type: string }
        review_item_id: { type: string }
        sentence_id: { type: [string, "null"] }
        media_id: { type: [string, "null"] }
        track_id: { type: [string, "null"] }
        target_snapshot: { type: string }
        prompt_snapshot: { type: string }
        failure_count: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/HuntingCandidateStatus" }
        created_at_ms: { type: integer, minimum: 0 }
        last_failed_at_ms: { type: integer, minimum: 0 }
    UpgradeSuggestionStatus:
      type: string
      enum: [pending, accepted, rejected, obsolete]
    UpgradeSuggestion:
      type: object
      required: [id, lexical_entry_id, lexical_display_form, previous_status, suggested_status, status, evidence_context_count, evidence_ids, threshold, evidence_class, created_at_ms, resolved_at_ms, cooldown_until_ms, capability, previous_assessment, suggested_assessment]
      properties:
        id: { type: string }
        lexical_entry_id: { type: string }
        lexical_display_form: { type: string }
        previous_status: { $ref: "#/components/schemas/LearningStatus" }
        suggested_status: { $ref: "#/components/schemas/LearningStatus" }
        status: { $ref: "#/components/schemas/UpgradeSuggestionStatus" }
        evidence_context_count: { type: integer, minimum: 0 }
        evidence_ids: { type: array, items: { type: string } }
        threshold: { type: integer, minimum: 1 }
        evidence_class: { type: string }
        created_at_ms: { type: integer, minimum: 0 }
        resolved_at_ms: { type: [integer, "null"], minimum: 0 }
        cooldown_until_ms: { type: [integer, "null"], minimum: 0 }
        capability: { type: [string, "null"], enum: [listening, null] }
        previous_assessment: { type: [string, "null"], enum: [not_acquired, acquired, unassessed, null] }
        suggested_assessment: { type: [string, "null"], enum: [not_acquired, acquired, unassessed, null] }
    CoachMetric:
      type: object
      required: [key, value, source, authority_layer]
      properties:
        key: { type: string }
        value: { type: integer, minimum: 0 }
        source: { type: string }
        authority_layer: { type: string }
    CoachSuggestionDestination:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [review_queue, hunting_list, content_home] }
    CoachSuggestion:
      type: object
      required: [id, kind, title_key, reason_key, destination, evidence_source, evidence_count]
      properties:
        id: { type: string }
        kind: { type: string }
        title_key: { type: string }
        reason_key: { type: string }
        destination: { $ref: "#/components/schemas/CoachSuggestionDestination" }
        evidence_source: { type: string }
        evidence_count: { type: integer, minimum: 0 }
    CoachMaterialInsight:
      type: object
      required: [media_id, title, report_count, first_report, latest_report, reports_understood_all, reports_got_the_gist, reports_unclear, practice_attempts, practice_correct, triage_intent, graduation_candidate, recommended_intent]
      properties:
        media_id: { type: string }
        title: { type: string }
        report_count: { type: integer, minimum: 0 }
        first_report: { type: [string, "null"], enum: [understood_all, got_the_gist, unclear, null] }
        latest_report: { type: [string, "null"], enum: [understood_all, got_the_gist, unclear, null] }
        reports_understood_all: { type: integer, minimum: 0 }
        reports_got_the_gist: { type: integer, minimum: 0 }
        reports_unclear: { type: integer, minimum: 0 }
        practice_attempts: { type: integer, minimum: 0 }
        practice_correct: { type: integer, minimum: 0 }
        triage_intent: { type: [string, "null"], enum: [pin_extensive, pin_intensive, defer, graduated, null] }
        graduation_candidate: { type: boolean }
        recommended_intent: { type: [string, "null"], enum: [pin_extensive, pin_intensive, null] }
    CoachEvidenceItem:
      type: object
      required: [id, occurred_at_ms, result, source_kind, snapshot, source_available]
      properties:
        id: { type: string }
        occurred_at_ms: { type: integer, minimum: 0 }
        result: { type: string }
        source_kind: { type: string }
        snapshot: { type: string }
        source_available: { type: boolean }
        unavailable_reason: { type: string }
    CoachDashboard:
      type: object
      required: [period_start_ms, period_end_ms, generated_at_ms, listening_metrics, suggestions, starter_checklist, materials]
      properties:
        period_start_ms: { type: integer, minimum: 0 }
        period_end_ms: { type: integer, minimum: 0 }
        generated_at_ms: { type: integer, minimum: 0 }
        listening_metrics: { type: array, items: { $ref: "#/components/schemas/CoachMetric" } }
        suggestions: { type: array, items: { $ref: "#/components/schemas/CoachSuggestion" } }
        starter_checklist: { type: array, items: { type: string } }
        materials: { type: array, items: { $ref: "#/components/schemas/CoachMaterialInsight" } }
