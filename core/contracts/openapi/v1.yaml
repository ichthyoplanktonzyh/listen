openapi: 3.1.0
info:
  title: LLPlayerNext Local API
  version: 1.0.0
  description: Versioned loopback-only application-service adapter. Playback control is excluded.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service health and API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/media:
    post:
      operationId: registerMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMedia"
      responses:
        "200":
          description: Idempotently registered media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: readMedia
      responses:
        "200":
          description: Media metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/progress:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      operationId: readProgress
      responses:
        "200":
          description: Last saved position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Progress"
      responses:
        "200":
          description: Saved position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/{media_id}/subtitles:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    post:
      operationId: importSubtitle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSubtitle"
      responses:
        "200":
          description: Complete normalized subtitle timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
  /v1/subtitles/{track_id}:
    parameters:
      - name: track_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: readSubtitle
      responses:
        "200":
          description: Complete normalized subtitle timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleTrack"
        default:
          $ref: "#/components/responses/Error"
  /v1/subtitles/{track_id}/export:
    get:
      operationId: exportSubtitle
      parameters:
        - { name: track_id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, default: srt } }
      responses:
        "200": { description: Generated SRT subtitle }
  /v1/word-profiles:
    get:
      operationId: readWordProfile
      parameters:
        - name: language
          in: query
          required: true
          schema: { type: string }
        - name: lemma
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profile or null when not classified
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/WordProfile"
                  - type: "null"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateWordProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWordProfile"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordProfile"
        default:
          $ref: "#/components/responses/Error"
  /v1/word-profiles/batch:
    post:
      operationId: readWordProfiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchWordProfiles"
      responses:
        "200":
          description: Existing profiles; absent lemmas are unclassified
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WordProfile" }
        default:
          $ref: "#/components/responses/Error"
  /v1/word-observations:
    post:
      operationId: createWordObservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWordObservation"
      responses:
        "200":
          description: Context-specific listening observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordObservation"
        default:
          $ref: "#/components/responses/Error"
  /v1/vocabulary:
    get:
      operationId: listVocabulary
      parameters:
        - { name: language, in: query, schema: { type: string, default: en } }
        - { name: status, in: query, required: true, schema: { enum: [unknown_meaning, known_not_recognized, known_recognized] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Dynamic vocabulary book
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WordDetails" } }
  /v1/vocabulary/export:
    get:
      operationId: exportVocabulary
      responses:
        "200":
          description: Versioned portable vocabulary assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VocabularyAssetBundle" }
  /v1/vocabulary/import:
    post:
      operationId: importVocabulary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VocabularyAssetBundle" }
      responses:
        "200": { description: Assets merged }
  /v1/vocabulary/import-external:
    post:
      operationId: importExternalVocabulary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalVocabularyImport" }
      responses:
        "200":
          description: External word list import summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalVocabularyImportSummary" }
  /v1/word-profiles/{profile_id}/details:
    get:
      operationId: wordDetails
      parameters:
        - { name: profile_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Profile, history and durable sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordDetails" }
  /v1/word-profiles/{profile_id}/learning-content:
    put:
      operationId: updateWordLearningContent
      parameters:
        - { name: profile_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_definition: { type: [string, "null"] }
                personal_note: { type: [string, "null"] }
      responses:
        "200":
          description: Updated learning content and word details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordDetails" }
  /v1/media/{media_id}/availability:
    put:
      operationId: updateMediaAvailability
      parameters:
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability: { enum: [available, missing, archived] }
      responses:
        "200":
          description: Updated media
  /v1/events:
    get:
      operationId: events
      responses:
        "200":
          description: Versioned server-sent domain event stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/dictionary:
    get:
      operationId: dictionaryLookup
      parameters:
        - name: language
          in: query
          required: true
          schema: { type: string }
        - name: lemma
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Aggregated results from registered dictionary providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryLookupBundle" }
        default:
          $ref: "#/components/responses/Error"
  /v1/sentences/{sentence_id}/diagnosis:
    parameters:
      - name: sentence_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: diagnoseSentence
      responses:
        "200":
          description: Deterministic explainable sentence diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentenceDiagnosis"
        default:
          $ref: "#/components/responses/Error"
  /v1/transcription/providers:
    get:
      operationId: transcriptionProviders
      responses:
        "200": { description: Available transcription providers and runtimes }
  /v1/transcription/models:
    get:
      operationId: transcriptionModels
      responses:
        "200": { description: Model catalog and installation states }
  /v1/transcription/models/install:
    post:
      operationId: installTranscriptionModel
      responses:
        "200": { description: Model installation started }
  /v1/transcription/models/register-custom:
    post:
      operationId: registerCustomTranscriptionModel
      responses:
        "200": { description: Custom model registered }
  /v1/transcription/models/{model_id}/cancel-install:
    post:
      operationId: cancelTranscriptionModelInstall
      responses:
        "200": { description: Model installation cancelled }
  /v1/transcription/models/{model_id}:
    delete:
      operationId: deleteTranscriptionModel
      responses:
        "204": { description: Model removed }
  /v1/transcription/jobs:
    get:
      operationId: transcriptionJobs
      responses:
        "200": { description: Durable transcription jobs }
    post:
      operationId: createTranscriptionJob
      responses:
        "200": { description: Queued or idempotently reused transcription job }
  /v1/transcription/jobs/{job_id}:
    get:
      operationId: transcriptionJob
      responses:
        "200": { description: Durable transcription job }
  /v1/transcription/jobs/{job_id}/cancel:
    post:
      operationId: cancelTranscriptionJob
      responses:
        "200": { description: Cancelled transcription job }
  /v1/transcription/jobs/{job_id}/retry:
    post:
      operationId: retryTranscriptionJob
      responses:
        "200": { description: Retried transcription job }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    MediaId:
      name: media_id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, api_version]
      properties:
        status: { const: ok }
        api_version: { const: 1 }
    RegisterMedia:
      type: object
      required: [path, fingerprint, title, kind]
      properties:
        path: { type: string }
        fingerprint: { type: string }
        title: { type: string }
        kind: { enum: [video, audio] }
        duration_ms: { type: [integer, "null"], minimum: 0 }
    MediaItem:
      type: object
      required: [id, path, fingerprint, title, kind, duration, availability, created_at_ms, updated_at_ms]
      properties:
        id: { type: string }
        path: { type: string }
        fingerprint: { type: string }
        title: { type: string }
        kind: { enum: [video, audio] }
        duration: { type: [integer, "null"], minimum: 0 }
        availability: { enum: [available, missing, archived] }
        created_at_ms: { type: integer, minimum: 0 }
        updated_at_ms: { type: integer, minimum: 0 }
    Progress:
      type: object
      required: [position_ms]
      properties:
        position_ms: { type: [integer, "null"], minimum: 0 }
    ImportSubtitle:
      type: object
      required: [path]
      properties:
        path: { type: string }
        language: { type: [string, "null"] }
    SubtitleToken:
      type: object
      required: [index, kind, text, normalized, start_char, end_char]
      properties:
        index: { type: integer, minimum: 0 }
        kind: { enum: [word, whitespace, punctuation, other] }
        text: { type: string }
        normalized: { type: [string, "null"] }
        start_char: { type: integer, minimum: 0 }
        end_char: { type: integer, minimum: 0 }
    SubtitleSentence:
      type: object
      required: [id, index, start, end, original_text, display_text, tokens]
      properties:
        id: { type: string }
        index: { type: integer, minimum: 0 }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        original_text: { type: string }
        display_text: { type: string }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/SubtitleToken" }
    SubtitleTrack:
      type: object
      required: [id, media_id, fingerprint, language, source, sentences]
      properties:
        id: { type: string }
        media_id: { type: string }
        fingerprint: { type: string }
        language: { type: [string, "null"] }
        source: { type: string }
        sentences:
          type: array
          items: { $ref: "#/components/schemas/SubtitleSentence" }
    WordProfile:
      type: object
      required: [id, language, lemma, normalized_lemma, display_form, status, updated_at_ms, user_definition, personal_note, learning_updated_at_ms]
      properties:
        id: { type: string }
        language: { type: string }
        lemma: { type: string }
        normalized_lemma: { type: string }
        display_form: { type: string }
        status:
          anyOf:
            - enum: [unknown_meaning, known_not_recognized, known_recognized]
            - type: "null"
        updated_at_ms: { type: integer, minimum: 0 }
        user_definition: { type: [string, "null"] }
        personal_note: { type: [string, "null"] }
        learning_updated_at_ms: { type: integer, minimum: 0 }
    UpdateWordProfile:
      type: object
      required: [language, lemma, display_form]
      properties:
        language: { type: string }
        lemma: { type: string }
        display_form: { type: string }
        status:
          anyOf:
            - enum: [unknown_meaning, known_not_recognized, known_recognized]
            - type: "null"
        source:
          anyOf:
            - $ref: "#/components/schemas/SourceContext"
            - type: "null"
    BatchWordProfiles:
      type: object
      required: [language, lemmas]
      properties:
        language: { type: string }
        lemmas:
          type: array
          maxItems: 5000
          items: { type: string }
    CreateWordObservation:
      type: object
      required: [word_profile_id, sentence_id, original_form]
      properties:
        word_profile_id: { type: string }
        sentence_id: { type: string }
        original_form: { type: string }
        result:
          anyOf:
            - enum: [recognized_in_context, not_recognized_in_context]
            - type: "null"
        clear: { type: boolean, default: false }
        source:
          anyOf:
            - $ref: "#/components/schemas/SourceContext"
            - type: "null"
    SourceContext:
      type: object
      required: [language, normalized_lemma, original_form, sentence_text, media_title, media_fingerprint, start_ms, end_ms]
      properties:
        language: { type: string }
        normalized_lemma: { type: string }
        media_id: { type: [string, "null"] }
        sentence_id: { type: [string, "null"] }
        original_form: { type: string }
        sentence_text: { type: string }
        media_title: { type: string }
        media_fingerprint: { type: string }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
    WordObservation:
      type: object
      required: [id, word_profile_id, sentence_id, original_form, result, created_at_ms]
      properties:
        id: { type: string }
        word_profile_id: { type: string }
        sentence_id: { type: string }
        original_form: { type: string }
        result: { enum: [recognized_in_context, not_recognized_in_context] }
        created_at_ms: { type: integer, minimum: 0 }
    WordOccurrence:
      type: object
      required: [id, source_key, word_profile_id, original_form, sentence_text_snapshot, media_title_snapshot, media_fingerprint_snapshot, start_ms_snapshot, end_ms_snapshot, first_seen_at_ms, last_seen_at_ms, encounter_count]
      properties:
        id: { type: string }
        source_key: { type: string }
        word_profile_id: { type: string }
        media_id: { type: [string, "null"] }
        sentence_id: { type: [string, "null"] }
        original_form: { type: string }
        sentence_text_snapshot: { type: string }
        media_title_snapshot: { type: string }
        media_fingerprint_snapshot: { type: string }
        start_ms_snapshot: { type: integer, minimum: 0 }
        end_ms_snapshot: { type: integer, minimum: 0 }
        first_seen_at_ms: { type: integer, minimum: 0 }
        last_seen_at_ms: { type: integer, minimum: 0 }
        encounter_count: { type: integer, minimum: 1 }
    WordStatusHistory:
      type: object
      required: [id, word_profile_id, previous_status, new_status, source_occurrence_id, changed_at_ms, change_source]
      properties:
        id: { type: string }
        word_profile_id: { type: string }
        previous_status: { type: [string, "null"] }
        new_status: { type: [string, "null"] }
        source_occurrence_id: { type: [string, "null"] }
        changed_at_ms: { type: integer, minimum: 0 }
        change_source: { enum: [user_selection, import, legacy_baseline] }
    WordDetails:
      type: object
      required: [profile, history, occurrences]
      properties:
        profile: { $ref: "#/components/schemas/WordProfile" }
        history: { type: array, items: { $ref: "#/components/schemas/WordStatusHistory" } }
        occurrences: { type: array, items: { $ref: "#/components/schemas/WordOccurrence" } }
    VocabularyAssetBundle:
      type: object
      required: [version, exported_at_ms, profiles, history, occurrences, observations]
      properties:
        version: { enum: [1, 2] }
        exported_at_ms: { type: integer, minimum: 0 }
        profiles: { type: array, items: { $ref: "#/components/schemas/WordProfile" } }
        history: { type: array, items: { $ref: "#/components/schemas/WordStatusHistory" } }
        occurrences: { type: array, items: { $ref: "#/components/schemas/WordOccurrence" } }
        observations: { type: array, items: { $ref: "#/components/schemas/WordObservation" } }
    DictionaryLookup:
      type: object
      required: [query, lemma, definitions, phonetics, provider, cached_at_ms]
      properties:
        query: { type: string }
        lemma: { type: string }
        definitions:
          type: array
          items:
            type: object
            required: [part_of_speech, text]
            properties:
              part_of_speech: { type: [string, "null"] }
              text: { type: string }
        phonetics:
          type: array
          items:
            type: object
            required: [text, region]
            properties:
              text: { type: string }
              region: { type: [string, "null"] }
        provider: { type: string }
        cached_at_ms: { type: integer, minimum: 0 }
    DictionaryLookupBundle:
      type: object
      required: [query, normalized_lemma, results]
      properties:
        query: { type: string }
        normalized_lemma: { type: string }
        results:
          type: array
          items:
            type: object
            required: [provider, lookup, error]
            properties:
              provider:
                type: object
                required: [id, display_name, supported_languages, provides_definitions, provides_phonetics, provides_audio, offline]
                properties:
                  id: { type: string }
                  display_name: { type: string }
                  supported_languages: { type: array, items: { type: string } }
                  provides_definitions: { type: boolean }
                  provides_phonetics: { type: boolean }
                  provides_audio: { type: boolean }
                  offline: { type: boolean }
              lookup:
                anyOf:
                  - $ref: "#/components/schemas/DictionaryLookup"
                  - type: "null"
              error: { type: [string, "null"] }
    ExternalVocabularyImport:
      type: object
      required: [language, entries, default_status, overwrite_existing]
      properties:
        language: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [word, status]
            properties:
              word: { type: string }
              status:
                anyOf:
                  - enum: [unknown_meaning, known_not_recognized, known_recognized]
                  - type: "null"
        default_status:
          anyOf:
            - enum: [unknown_meaning, known_not_recognized, known_recognized]
            - type: "null"
        overwrite_existing: { type: boolean }
    ExternalVocabularyImportSummary:
      type: object
      required: [created, initialized, skipped, overwritten, invalid]
      properties:
        created: { type: integer, minimum: 0 }
        initialized: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        overwritten: { type: integer, minimum: 0 }
        invalid: { type: integer, minimum: 0 }
    SentenceDiagnosis:
      type: object
      required: [sentence_id, hints, unclassified_lemmas]
      properties:
        sentence_id: { type: string }
        hints:
          type: array
          items:
            type: object
            required: [kind, message, word_profile_ids]
            properties:
              kind:
                enum: [meaning_barrier, recognition_barrier, insufficient_information, other_factors]
              message: { type: string }
              word_profile_ids:
                type: array
                items: { type: string }
        unclassified_lemmas:
          type: array
          items: { type: string }
    Error:
      type: object
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string }
        retryable: { type: boolean }
