    get:
      operationId: trackSyntaxAnalysisStatus
      responses:
        "200":
          description: Current cache state; stale means the track or qualified model fingerprint changed
    post:
      operationId: runTrackSyntaxAnalysis
      description: Reuses or rebuilds the optional whole-track syntax batch cache; each sentence remains independently validated.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
                patterns:
