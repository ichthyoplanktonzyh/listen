          description: Learning capability profile for one language
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageLearningProfile"
        default:
          $ref: "#/components/responses/Error"
  /v1/learner/profile:
    get:
      operationId: learnerProfile
      responses:
        "200":
          description: Unified learner profile read model (L1 / UI-language snapshot / reserved L2)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerProfileView" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateLearnerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                l1_language:
                  type: [string, "null"]
                  description: BCP-47-ish language code; null or absent clears the L1 setting.
                ui_language:
                  type: [string, "null"]
                  description: Client UI-language snapshot; authority stays in client settings.
      responses:
        "200":
          description: Updated learner profile view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerProfileView" }
        default:
          $ref: "#/components/responses/Error"
  /v1/learner/l1-specialty:
    get:
      operationId: l1SpecialtyOccurrences
      parameters:
        - name: difficulty_kind
          in: query
          required: true
          schema: { type: string }
        - name: language
          in: query
          required: true
          schema: { type: string }
        - name: track_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Same-family clips aggregated from the learner's corpus for one L1 difficulty category; degrades to current-track aggregation (indexed=false) when the family projection is absent.
          content:
            application/json:
              schema:
                type: object
                required: [difficulty_kind, families, indexed, occurrences]
                properties:
                  difficulty_kind: { type: string }
                  families:
                    type: array
                    items: { type: string }
                  indexed: { type: boolean }
                  occurrences:
                    type: array
                    items: { $ref: "#/components/schemas/CorpusOccurrence" }
        default:
          $ref: "#/components/responses/Error"
  /v1/sentences/{sentence_id}/diagnosis:
    parameters:
      - name: sentence_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: diagnoseSentence
      responses:
        "200":
          description: Deterministic explainable sentence diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentenceDiagnosis"
        default:
          $ref: "#/components/responses/Error"
  /v1/transcription/providers:
    get:
      operationId: transcriptionProviders
      responses:
        "200": { description: Available transcription providers and runtimes }
  /v1/transcription/models:
    get:
      operationId: transcriptionModels
      responses:
        "200": { description: Model catalog and installation states }
  /v1/transcription/models/install:
    post:
      operationId: installTranscriptionModel
      responses:
        "200": { description: Model installation started }
  /v1/transcription/models/register-custom:
    post:
      operationId: registerCustomTranscriptionModel
      responses:
        "200": { description: Custom model registered }
  /v1/transcription/models/{model_id}/cancel-install:
    post:
      operationId: cancelTranscriptionModelInstall
      responses:
        "200": { description: Model installation cancelled }
  /v1/transcription/models/{model_id}:
    delete:
      operationId: deleteTranscriptionModel
      responses:
        "204": { description: Model removed }
  /v1/transcription/jobs:
    get:
      operationId: transcriptionJobs
      responses:
        "200": { description: Durable transcription jobs }
    post:
      operationId: createTranscriptionJob
      responses:
        "200": { description: Queued or idempotently reused transcription job }
  /v1/transcription/jobs/{job_id}:
    get:
      operationId: transcriptionJob
      responses:
        "200": { description: Durable transcription job }
  /v1/transcription/jobs/{job_id}/cancel:
    post:
      operationId: cancelTranscriptionJob
      responses:
        "200": { description: Cancelled transcription job }
  /v1/transcription/jobs/{job_id}/retry:
    post:
      operationId: retryTranscriptionJob
      responses:
        "200": { description: Retried transcription job }
  /v1/transcription/jobs/{job_id}/archive:
    post:
      operationId: archiveTranscriptionJob
      responses:
        "200": { description: Archived transcription job }
  /v1/phonetic-analysis/providers:
    get:
      operationId: phoneticAnalysisProviders
      responses:
        "200": { description: Experimental real-audio phonetic provider capabilities }
  /v1/phonetic-analysis/models:
    get:
      operationId: phoneticAnalysisModels
      responses:
        "200": { description: Phonetic model catalog, provenance, licensing, and state }
  /v1/phonetic-analysis/models/install:
    post:
      operationId: installPhoneticAnalysisModel
      responses:
        "200": { description: Updated phonetic model installation state }
  /v1/phonetic-analysis/models/register-custom:
    post:
      operationId: registerCustomPhoneticAnalysisModel
      responses:
        "200": { description: Registered custom phonetic model }
  /v1/phonetic-analysis/models/{model_id}/cancel-install:
    post:
      operationId: cancelPhoneticAnalysisModelInstall
      responses:
        "200": { description: Cancelled phonetic model installation }
  /v1/phonetic-analysis/models/{model_id}:
    delete:
      operationId: deletePhoneticAnalysisModel
      responses:
        "204": { description: Deleted phonetic model }
  /v1/phonetic-analysis/jobs:
    get:
      operationId: phoneticAnalysisJobs
      responses:
        "200": { description: Durable phonetic analysis jobs }
    post:
      operationId: createPhoneticAnalysisJob
      responses:
        "200": { description: Queued phonetic analysis job }
  /v1/phonetic-analysis/jobs/clear:
    post:
      operationId: clearTerminalPhoneticAnalysisJobs
      responses:
        "200":
          description: Deleted terminal phonetic analysis jobs
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
  /v1/phonetic-analysis/jobs/{job_id}:
    get:
      operationId: phoneticAnalysisJob
      responses:
        "200": { description: Durable phonetic analysis job }
  /v1/phonetic-analysis/jobs/{job_id}/cancel:
    post:
      operationId: cancelPhoneticAnalysisJob
      responses:
        "200": { description: Cancelled phonetic analysis job }
  /v1/phonetic-analysis/jobs/{job_id}/retry:
    post:
      operationId: retryPhoneticAnalysisJob
      responses:
        "200": { description: Retried phonetic analysis job }
  /v1/subtitles/{track_id}/phonetic-analyses:
    get:
      operationId: trackPhoneticAnalyses
      responses:
        "200": { description: Versioned detected-phone timelines and analyses }
  /v1/phonetic-analysis/{analysis_id}/findings:
    get:
      operationId: phoneticAnalysisFindings
      responses:
        "200": { description: Explainable findings for one phonetic analysis }
  /v1/phonetic-analysis/findings/{finding_id}/feedback:
    put:
      operationId: updatePhoneticFindingFeedback
      responses:
        "200": { description: Persisted user feedback for one finding }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    MediaId:
      name: media_id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SyntaxCapabilityView:
      type: object
      required: [status, progress, enabled, provider_version, runtime_version, model_version, model_checksum_sha256, delivery_checksum_sha256, expected_install_bytes, installed_bytes, updated_at_ms]
      properties:
        status: { type: string, enum: [not_installed, downloading, ready, partial, failed, stale, disabled] }
        progress: { type: number, minimum: 0, maximum: 1 }
        enabled: { type: boolean }
        provider_version: { type: string }
        runtime_version: { type: string }
        model_version: { type: string }
        model_checksum_sha256: { type: string }
        delivery_checksum_sha256: { type: string }
        expected_install_bytes: { type: integer, minimum: 0 }
        installed_bytes: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }
        updated_at_ms: { type: integer, minimum: 0 }
    Health:
      type: object
      required: [status, api_version]
      properties:
        status: { const: ok }
        api_version: { const: 1 }
    RegisterMedia:
      type: object
      required: [path, fingerprint, title, kind]
      properties:
        path: { type: string }
        fingerprint: { type: string }
        title: { type: string }
        kind: { enum: [video, audio] }
        duration_ms: { type: [integer, "null"], minimum: 0 }
    MediaItem:
      type: object
      required: [id, path, fingerprint, title, kind, duration, availability, created_at_ms, updated_at_ms]
      properties:
        id: { type: string }
        path: { type: string }
        fingerprint: { type: string }
        title: { type: string }
        kind: { enum: [video, audio] }
        duration: { type: [integer, "null"], minimum: 0 }
        availability: { enum: [available, missing, archived] }
        created_at_ms: { type: integer, minimum: 0 }
        updated_at_ms: { type: integer, minimum: 0 }
    MediaLibraryEntry:
      type: object
      required: [media, primary_track_id, fit, triage_intent, familiar_material]
      properties:
        media: { $ref: "#/components/schemas/MediaItem" }
        # Track the fit was resolved from (first available track with a
        # language); also the natural track for one-click session starts.
        primary_track_id: { type: [string, "null"] }
        fit:
          oneOf:
            - $ref: "#/components/schemas/ContentDifficultyProfile"
            - type: "null"
        # Explicit user judgment; outranks fit-derived queue suggestions.
        triage_intent:
          type: [string, "null"]
          enum: [pin_extensive, pin_intensive, defer, graduated, null]
        familiar_material: { type: boolean }
    SetTriageIntentRequest:
      type: object
      required: [intent]
      properties:
        # null clears the stored intent.
        intent:
          type: [string, "null"]
          enum: [pin_extensive, pin_intensive, defer, graduated, null]
    Progress:
      type: object
      required: [position_ms]
      properties:
        position_ms: { type: [integer, "null"], minimum: 0 }
    ImportSubtitle:
      type: object
      required: [path]
      properties:
        path: { type: string }
        language: { type: [string, "null"] }
    UpdateTrackLanguage:
      type: object
      required: [language]
      properties:
        language: { type: string }
    SubtitleToken:
      type: object
      required: [index, kind, text, normalized, start_char, end_char]
      properties:
        index: { type: integer, minimum: 0 }
        kind: { enum: [word, whitespace, punctuation, other] }
        text: { type: string }
        normalized: { type: [string, "null"] }
        start_char: { type: integer, minimum: 0 }
        end_char: { type: integer, minimum: 0 }
    SubtitleSentence:
      type: object
      required: [id, index, start, end, original_text, display_text, tokens]
      properties:
        id: { type: string }
        index: { type: integer, minimum: 0 }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        original_text: { type: string }
        display_text: { type: string }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/SubtitleToken" }
    SubtitleTrack:
      type: object
      required: [id, media_id, fingerprint, language, source, status, sentences]
      properties:
        id: { type: string }
        media_id: { type: string }
        fingerprint: { type: string }
        language: { type: [string, "null"] }
        source: { type: string }
        status: { enum: [available, archived] }
        sentences:
          type: array
          items: { $ref: "#/components/schemas/SubtitleSentence" }
    CapabilitySupport:
      enum: [supported, approximate, unsupported]
    LanguageLearningProfile:
      type: object
      required:
        - language
        - display_name
        - script
        - tokenization
        - lexical_granularities
        - lexical_normalization
        - listening_units
        - pronunciation
        - sound_features
        - rhythm_prosody
        - morphology
        - dictionary_providers
        - diagnosis_reasons
        - word_timeline
        - chunk_timeline
        - phone_timeline
      properties:
        language: { type: string }
        display_name: { type: string }
        script: { type: string }
        tokenization: { type: string }
        lexical_granularities:
          type: array
          items: { type: string }
        lexical_normalization: { type: string }
        listening_units:
          type: array
          items: { type: string }
        pronunciation: { type: string }
        sound_features:
          type: array
          items: { type: string }
        rhythm_prosody: { type: string }
        morphology: { type: string }
        dictionary_providers:
          type: array
          items: { type: string }
        diagnosis_reasons:
          type: array
          items: { type: string }
        word_timeline: { $ref: "#/components/schemas/CapabilitySupport" }
        chunk_timeline: { $ref: "#/components/schemas/CapabilitySupport" }
        phone_timeline: { $ref: "#/components/schemas/CapabilitySupport" }
    TimingSource:
      enum: [asr_reported, forced_aligned, estimated, user_adjusted]
    TimelineCreator:
      enum: [algorithm, user]
    TimelineStatus:
      enum: [candidate, active, archived]
    WordTimelineLifecycleStage:
      enum: [algorithm_candidate, user_adjusted, published]
    PhoneTimelinePrecision:
      enum: [detected, aligned, approximate]
    PhoneAlignmentKind:
      enum: [match, substitution, insertion, deletion, merge]
    PhoneticFindingStatus:
      enum: [uncertain, supported_by_alignment, detected_in_audio]
    DetectedPhone:
      type: object
      required: [symbol, display_ipa, phone_set, start_ms, end_ms, confidence, token_index, provider_id, provider_version, model_revision]
      properties:
        symbol: { type: string }
        display_ipa: { type: string }
        phone_set: { type: string }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        token_index: { type: [integer, "null"], minimum: 0 }
        provider_id: { type: string }
        provider_version: { type: string }
        model_revision: { type: string }
    PhoneAlignment:
      type: object
      required: [kind, token_start, token_end, canonical_phones, detected_phone_start, detected_phone_end, confidence]
      properties:
        kind: { $ref: "#/components/schemas/PhoneAlignmentKind" }
        token_start: { type: [integer, "null"], minimum: 0 }
        token_end: { type: [integer, "null"], minimum: 0 }
        canonical_phones:
          type: array
          items: { type: string }
        detected_phone_start: { type: [integer, "null"], minimum: 0 }
        detected_phone_end: { type: [integer, "null"], minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
    PhoneticFinding:
      type: object
      required: [id, analysis_id, finding_type, affected_token_start, affected_token_end, canonical_phones, detected_phones, aligned_phone_start, aligned_phone_end, audio_start_ms, audio_end_ms, confidence, evidence, status]
      properties:
        id: { type: string }
        analysis_id: { type: string }
        finding_type: { type: string }
        affected_token_start: { type: integer, minimum: 0 }
        affected_token_end: { type: integer, minimum: 0 }
        canonical_phones:
          type: array
          items: { type: string }
        detected_phones:
          type: array
          items: { type: string }
        aligned_phone_start: { type: [integer, "null"], minimum: 0 }
        aligned_phone_end: { type: [integer, "null"], minimum: 0 }
        audio_start_ms: { type: integer, minimum: 0 }
        audio_end_ms: { type: integer, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence: { type: string }
        status: { $ref: "#/components/schemas/PhoneticFindingStatus" }
    SoundPhoneEvidence:
      type: string
      enum: [expected_only, observed_only, match, substitution, merge, deletion]
    SyllableStress:
      type: string
      enum: [primary, secondary, unstressed, unknown]
    ProsodicBoundaryEvidence:
      type: string
      enum: [sentence_start, pause, tentative_lengthening, sentence_end]
    SoundLearningPhone:
      type: object
      required: [symbol, display_ipa, phone_set, start_ms, end_ms, confidence, token_index, observed_phone_index, observed_symbol, evidence]
      properties:
        symbol: { type: string }
        display_ipa: { type: string }
        phone_set: { type: string }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        token_index: { type: [integer, "null"], minimum: 0 }
        stress: { type: [integer, "null"], minimum: 0, maximum: 2 }
        observed_phone_index: { type: [integer, "null"], minimum: 0 }
        observed_symbol: { type: [string, "null"] }
        evidence: { $ref: "#/components/schemas/SoundPhoneEvidence" }
    SoundSyllable:
      type: object
      required: [phones, onset, nucleus, coda, start_ms, end_ms, stress]
      properties:
        phones:
          type: array
          items: { type: integer, minimum: 0 }
        onset:
          type: array
          items: { type: integer, minimum: 0 }
        nucleus:
          type: array
          items: { type: integer, minimum: 0 }
        coda:
          type: array
          items: { type: integer, minimum: 0 }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
        stress: { $ref: "#/components/schemas/SyllableStress" }
    SoundProsodicPhrase:
      type: object
      required: [syllables, start_ms, end_ms, boundary_evidence, confidence]
      properties:
        syllables:
          type: array
          items: { type: integer, minimum: 0 }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
        boundary_evidence: { $ref: "#/components/schemas/ProsodicBoundaryEvidence" }
        confidence: { type: number, minimum: 0, maximum: 1 }
    RhythmAnchorImportance:
      type: string
      enum: [primary, secondary]
    RhythmSignalSource:
      type: string
      enum: [text_prior, timing, energy, pitch, phone_segmental]
    RhythmEvidenceClass:
      type: string
      enum: [gold, silver_label, heuristic_proxy, manual_product_qa, coverage]
    RhythmClaimStatus:
      type: string
      enum: [predicted, audio_supported]
    RhythmDivergenceKind:
      type: string
      enum: [teachable_rule, clip_specific]
    RhythmReference:
      type: object
      required: [label, source, evidence_class]
      properties:
        label: { type: string }
        source: { type: string }
        evidence_class: { $ref: "#/components/schemas/RhythmEvidenceClass" }
    RhythmFrameReferences:
      type: object
      required: [citation, actual]
      properties:
        citation: { $ref: "#/components/schemas/RhythmReference" }
        default_connected:
          anyOf:
            - $ref: "#/components/schemas/RhythmReference"
            - type: "null"
        actual: { $ref: "#/components/schemas/RhythmReference" }
    ListeningHotspotKind:
      type: string
      enum: [weak_group, compressed_span, phrase_boundary, connected_speech]
    RhythmStressAnchor:
      type: object
      required: [token_index, syllable_index, phone_start, phone_end, start_ms, end_ms, label, reason, importance, is_nucleus, prominence, prominence_cues, signal_sources, evidence_class, claim_status, confidence]
      properties:
        token_index: { type: [integer, "null"], minimum: 0 }
        syllable_index: { type: [integer, "null"], minimum: 0 }
        phone_start: { type: [integer, "null"], minimum: 0 }
        phone_end: { type: [integer, "null"], minimum: 0 }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
        label: { type: string }
        reason: { type: string }
        importance: { $ref: "#/components/schemas/RhythmAnchorImportance" }
        is_nucleus: { type: boolean }
        prominence: { type: number, minimum: 0, maximum: 1 }
        prominence_cues:
          type: array
          items: { $ref: "#/components/schemas/RhythmSignalSource" }
        signal_sources:
          type: array
          items: { $ref: "#/components/schemas/RhythmSignalSource" }
        evidence_class: { $ref: "#/components/schemas/RhythmEvidenceClass" }
        claim_status: { $ref: "#/components/schemas/RhythmClaimStatus" }
        confidence: { type: number, minimum: 0, maximum: 1 }
    RhythmNucleus:
      type: object
      required: [phrase_index, token_index, syllable_index, start_ms, end_ms, label, reason, cues, evidence_class, claim_status, confidence]
      properties:
        phrase_index: { type: integer, minimum: 0 }
        token_index: { type: [integer, "null"], minimum: 0 }
        syllable_index: { type: [integer, "null"], minimum: 0 }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
        label: { type: string }
        reason: { type: string }
        cues:
          type: array
          items: { $ref: "#/components/schemas/RhythmSignalSource" }
        evidence_class: { $ref: "#/components/schemas/RhythmEvidenceClass" }
        claim_status: { $ref: "#/components/schemas/RhythmClaimStatus" }
        confidence: { type: number, minimum: 0, maximum: 1 }
    RhythmWeakGroup:
      type: object
      required: [token_start, token_end, phone_start, phone_end, anchor_token_index, start_ms, end_ms, label, reason, reduction_refs, signal_sources, evidence_class, claim_status, confidence]
      properties:
        token_start: { type: [integer, "null"], minimum: 0 }
        token_end: { type: [integer, "null"], minimum: 0 }
        phone_start: { type: [integer, "null"], minimum: 0 }
        phone_end: { type: [integer, "null"], minimum: 0 }
        anchor_token_index: { type: [integer, "null"], minimum: 0 }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
        label: { type: string }
        reason: { type: string }
        reduction_refs:
          type: array
          items: { type: string }
        signal_sources:
          type: array
          items: { $ref: "#/components/schemas/RhythmSignalSource" }
        evidence_class: { $ref: "#/components/schemas/RhythmEvidenceClass" }
        claim_status: { $ref: "#/components/schemas/RhythmClaimStatus" }
        confidence: { type: number, minimum: 0, maximum: 1 }
    RhythmCompressionSpan:
      type: object
      required: [token_start, token_end, phone_start, phone_end, start_ms, end_ms, expected_units, duration_ms, unit_rate_per_second, label, reason, signal_sources, evidence_class, claim_status, confidence]
      properties:
        token_start: { type: [integer, "null"], minimum: 0 }
        token_end: { type: [integer, "null"], minimum: 0 }
        phone_start: { type: [integer, "null"], minimum: 0 }
        phone_end: { type: [integer, "null"], minimum: 0 }
        start_ms: { type: integer, minimum: 0 }
        end_ms: { type: integer, minimum: 0 }
        expected_units: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        unit_rate_per_second: { type: number, minimum: 0 }
        label: { type: string }
        reason: { type: string }
        signal_sources:
          type: array
          items: { $ref: "#/components/schemas/RhythmSignalSource" }
        evidence_class: { $ref: "#/components/schemas/RhythmEvidenceClass" }
        claim_status: { $ref: "#/components/schemas/RhythmClaimStatus" }
        confidence: { type: number, minimum: 0, maximum: 1 }
    RhythmPhraseBoundary:
      type: object
      required: [after_token_index, before_token_index, at_ms, reason, cues, signal_sources, evidence_class, claim_status, is_final, confidence]
      properties:
        after_token_index: { type: [integer, "null"], minimum: 0 }
        before_token_index: { type: [integer, "null"], minimum: 0 }
        at_ms: { type: integer, minimum: 0 }
        reason: { type: string }
        cues:
          type: array
          items: { type: string }
        signal_sources:
          type: array
          items: { $ref: "#/components/schemas/RhythmSignalSource" }
        evidence_class: { $ref: "#/components/schemas/RhythmEvidenceClass" }
        claim_status: { $ref: "#/components/schemas/RhythmClaimStatus" }
        is_final: { type: boolean }
        confidence: { type: number, minimum: 0, maximum: 1 }
    ListeningHotspot:
      type: object
      required: [id, kind, token_start, token_end, phone_start, phone_end, start_ms, end_ms, label, hint, signal_sources, evidence_class, claim_status, confidence]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ListeningHotspotKind" }
        token_start: { type: [integer, "null"], minimum: 0 }
