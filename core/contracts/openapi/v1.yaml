            application/json:
              schema: { $ref: "#/components/schemas/HuntingOccurrenceQueryResult" }
  /v1/hunting/checks:
    post:
      operationId: submitHuntingCheck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitHuntingCheckInput" }
      responses:
        "200":
