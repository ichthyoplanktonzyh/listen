  /v1/phonetic-analysis/findings/{finding_id}/feedback:
    parameters:
      - { name: finding_id, in: path, required: true, schema: { type: string } }
    put:
      operationId: updatePhoneticFindingFeedback
      responses:
        "200": { description: Persisted user feedback for one finding }
components:
  parameters:
    MediaId:
      name: media_id
      in: path
      required: true
      schema: { type: string }
    MaterialId:
      name: material_id
      in: path
      required: true
      schema: { type: string }
    MaterialRevisionId:
      name: revision_id
      in: path
      required: true
      schema: { type: string }
    PackageReleaseId:
      name: release_id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CreateSoundLineJob:
      type: object
      required: [track_id]
      properties:
        track_id: { type: string }
        audio_track:
          type: [integer, "null"]
          minimum: 0
          description: >
            Zero-based audio stream index in ffmpeg 0:a:N order. May be
            omitted only when the media contains exactly one audio stream.
    SoundLineJob:
      type: object
      required:
        - id
        - track_id
        - audio_track
        - status
        - timeline_id
        - acoustic_cue_count
        - error_code
        - error
        - retry_of_job_id
        - created_at_ms
        - updated_at_ms
      properties:
        id: { type: string }
        track_id: { type: string }
        audio_track:
          type: [integer, "null"]
          minimum: 0
          description: >
            Requested zero-based audio stream index and, for completed jobs,
            the stream verified by ffprobe and used by ffmpeg. Null means the
            job has not resolved an audio stream, including legacy or failed
            unselected jobs.
        status: { type: string, enum: [queued, running, completed, cancelled, failed] }
        timeline_id: { type: [string, "null"] }
        acoustic_cue_count: { type: integer, minimum: 0 }
        error_code:
          type: [string, "null"]
          enum:
            - audio_track_required
            - audio_track_not_found
            - audio_track_probe_failed
            - sound_line_source_unavailable
            - sound_line_failed
            - null
        error: { type: [string, "null"] }
        retry_of_job_id: { type: [string, "null"] }
        created_at_ms: { type: integer, minimum: 0 }
        updated_at_ms: { type: integer, minimum: 0 }
    SpeechSynthesisLocality:
      type: string
      enum: [local, remote]
    SpeechSynthesisProvider:
      type: object
      required: [id, display_name, version, locality]
      properties:
        id: { type: string }
        display_name: { type: string }
        version: { type: string }
        locality: { $ref: "#/components/schemas/SpeechSynthesisLocality" }
    SpeechSynthesisVoice:
      type: object
      required: [id, provider_id, display_name, language]
      properties:
        id: { type: string }
        provider_id: { type: string }
        display_name: { type: string }
        language: { type: string }
    SpeechSynthesisCapability:
      type: object
      required: [status, providers, voices, cache_bytes, cache_entries, error]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        providers:
          type: array
          items: { $ref: "#/components/schemas/SpeechSynthesisProvider" }
        voices:
          type: array
          items: { $ref: "#/components/schemas/SpeechSynthesisVoice" }
        cache_bytes: { type: integer, minimum: 0 }
        cache_entries: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }
    SpeechSynthesisRequest:
      type: object
      required: [text, language]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        language: { type: string }
        provider_id: { type: [string, "null"] }
        voice_id: { type: [string, "null"] }
        rate_words_per_minute: { type: integer, minimum: 80, maximum: 450, default: 180 }
        purpose: { type: [string, "null"] }
    SpeechSynthesisAsset:
      type: object
      required: [audio_path, mime_type, provider_id, provider_version, voice_id, language, rate_words_per_minute, purpose, content_hash, cache_hit, synthetic]
      properties:
        audio_path: { type: string }
        mime_type: { type: string }
        provider_id: { type: string }
        provider_version: { type: string }
        voice_id: { type: string }
        language: { type: string }
        rate_words_per_minute: { type: integer }
        purpose: { type: [string, "null"] }
        content_hash: { type: string }
        cache_hit: { type: boolean }
        synthetic: { type: boolean, const: true }
    SyntaxCapabilityView:
      type: object
      required: [status, progress, enabled, provider_version, runtime_version, model_version, model_checksum_sha256, delivery_checksum_sha256, expected_install_bytes, installed_bytes, updated_at_ms]
      properties:
        status: { type: string, enum: [not_installed, downloading, ready, partial, failed, stale, disabled] }
        progress: { type: number, minimum: 0, maximum: 1 }
        enabled: { type: boolean }
        provider_version: { type: string }
        runtime_version: { type: string }
        model_version: { type: string }
        model_checksum_sha256: { type: string }
        delivery_checksum_sha256: { type: string }
        expected_install_bytes: { type: integer, minimum: 0 }
        installed_bytes: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }
        updated_at_ms: { type: integer, minimum: 0 }
    Health:
      type: object
      required: [status, api_version, contract_version, runtime_version]
      properties:
        status: { const: ok }
        api_version: { const: 1 }
        contract_version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        runtime_version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
    RegisterMedia:
      type: object
      required: [path, fingerprint, title, kind]
      properties:
        path: { type: string }
        fingerprint: { type: string }
        title: { type: string }
        kind: { enum: [video, audio] }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        retain:
          type: [boolean, "null"]
          default: true
          description: >
            Personal Library membership choice. Omitted (or null) means
            retained, preserving the historical behavior for old clients.
            Explicit false registers Temporary Material: the media stays
            registered and readable by ID, but is absent from the media
            library until explicitly retained. Explicit true retains it.
            Membership evidence is set once: re-registering an already
            retained item (even with `retain: false`) never clears or
            rewrites the original membership timestamp.
    MediaItem:
      type: object
      required:
        - id
        - path
        - fingerprint
        - title
        - kind
        - duration
        - availability
        - retained_at_ms
        - created_at_ms
        - updated_at_ms
      properties:
        id: { type: string }
        path: { type: string }
        fingerprint: { type: string }
        title: { type: string }
        kind: { enum: [video, audio] }
        duration: { type: [integer, "null"], minimum: 0 }
        availability:
          enum: [available, missing, archived]
          description: >
            Playback-source state. Detached LLTimeline imports are missing
            because document path metadata is only a source snapshot. Recover
            them by registering real media and importing the LLTimeline for
            that media; changing availability alone cannot make a synthetic
            lltimeline:// source playable.
        retained_at_ms:
          type: [integer, "null"]
          minimum: 0
          description: >
            Evidence of explicit Personal Library membership; required but
            nullable so every response states known membership. Non-null
            means the media is a library member and carries the
            deterministic membership time; null means Temporary Material
            (registered and readable, but absent from the media library).
            Availability remains a separate playback-source fact: an item
            can be retained while its source is missing. The value is set
            once at first retention and is never silently rewritten or
            cleared by repeated registration or retention.
        created_at_ms: { type: integer, minimum: 0 }
        updated_at_ms: { type: integer, minimum: 0 }
    MediaLibraryEntry:
      type: object
      required: [media, primary_track_id, fit, triage_intent]
      properties:
        media: { $ref: "#/components/schemas/MediaItem" }
        primary_track_id: { type: [string, "null"] }
        fit:
          oneOf:
            - { $ref: "#/components/schemas/ContentDifficultyProfile" }
            - { type: "null" }
        triage_intent:
          type: [string, "null"]
          enum: [pin_extensive, pin_intensive, defer, graduated, null]
    SetTriageIntentRequest:
      type: object
      required: [intent]
      properties:
        # null clears the stored intent.
        intent:
          type: [string, "null"]
          enum: [pin_extensive, pin_intensive, defer, graduated, null]
    Progress:
      type: object
      required: [position_ms]
      properties:
        position_ms: { type: [integer, "null"], minimum: 0 }
    ImportSubtitle:
      type: object
      required: [path]
      properties:
        path: { type: string }
        language: { type: [string, "null"] }
    UpdateTrackLanguage:
      type: object
      required: [language]
      properties:
        language: { type: string }
    SubtitleToken:
      type: object
      required: [index, kind, text, normalized, start_char, end_char]
      properties:
        index: { type: integer, minimum: 0 }
        kind: { enum: [word, whitespace, punctuation, other] }
        text: { type: string }
        normalized: { type: [string, "null"] }
        start_char: { type: integer, minimum: 0 }
        end_char: { type: integer, minimum: 0 }
    SubtitleSentence:
      type: object
      required: [id, index, start, end, original_text, display_text, tokens]
      properties:
        id: { type: string }
        index: { type: integer, minimum: 0 }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        original_text: { type: string }
        display_text: { type: string }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/SubtitleToken" }
    SubtitleTrack:
      type: object
      required: [id, media_id, fingerprint, language, source, status, sentences]
      properties:
        id: { type: string }
        media_id: { type: string }
        fingerprint: { type: string }
        language: { type: [string, "null"] }
        source: { type: string }
        status: { enum: [available, archived] }
        sentences:
          type: array
          items: { $ref: "#/components/schemas/SubtitleSentence" }
    CapabilitySupport:
      enum: [supported, approximate, unsupported]
    LanguageLearningProfile:
      type: object
      required:
        - language
        - display_name
        - script
        - tokenization
        - lexical_granularities
        - lexical_normalization
        - listening_units
        - pronunciation
        - sound_features
        - rhythm_prosody
        - morphology
        - dictionary_providers
        - diagnosis_reasons
        - word_timeline
        - phone_timeline
      properties:
        language: { type: string }
        display_name: { type: string }
        script: { type: string }
        tokenization: { type: string }
        lexical_granularities:
          type: array
          items: { type: string }
        lexical_normalization: { type: string }
        listening_units:
          type: array
          items: { type: string }
        pronunciation: { type: string }
        sound_features:
          type: array
          items: { type: string }
        rhythm_prosody: { type: string }
        morphology: { type: string }
        dictionary_providers:
          type: array
          items: { type: string }
        diagnosis_reasons:
          type: array
          items: { type: string }
        word_timeline: { $ref: "#/components/schemas/CapabilitySupport" }
        phone_timeline: { $ref: "#/components/schemas/CapabilitySupport" }
    TimingSource:
      enum: [asr_reported, forced_aligned, estimated, user_adjusted]
    TimelineCreator:
      enum: [algorithm, user]
    TimelineStatus:
      enum: [candidate, active, archived]
    WordTimelineLifecycleStage:
      enum: [algorithm_candidate, user_adjusted, published]
    PhoneTimelinePrecision:
      enum: [detected, aligned, approximate]
    PhoneAlignmentKind:
      enum: [match, substitution, insertion, deletion, merge]
    PhoneticFindingStatus:
      enum: [uncertain, supported_by_alignment, detected_in_audio]
    DetectedPhone:
      type: object
      required: [symbol, display_ipa, phone_set, start_ms, end_ms, confidence, token_index, provider_id, provider_version, model_revision]
      properties:
