[package]
name = "api-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
application = { path = "../application" }
api-events = { path = "../api-events" }
async-stream.workspace = true
async-trait.workspace = true
futures-core.workspace = true
axum.workspace = true
dictionary-provider = { path = "../dictionary-provider" }
domain = { path = "../domain" }
hex.workspace = true
llm-provider = { path = "../llm-provider" }
persistence-sqlite = { path = "../persistence-sqlite" }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tower.workspace = true

# Composition root owns the platform-specific secret store. security-framework
# is already in the dependency tree; the macOS keychain path is cfg-gated.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
