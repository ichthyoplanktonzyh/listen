[package]
name = "subtitle-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
subtitle-core = { path = ".." }

# Prevent this from being checked by clippy when running
# cargo clippy --workspace --all-targets
[[bin]]
name = "srt_parse"
path = "fuzz_targets/srt_parse.rs"
test = false
doc = false

[[bin]]
name = "vtt_parse"
path = "fuzz_targets/vtt_parse.rs"
test = false
doc = false
