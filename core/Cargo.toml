[workspace]
members = [
  "crates/api-events",
  "crates/api-http",
  "crates/application",
  "crates/domain",
  "crates/dictionary-provider",
  "crates/diagnosis-core",
  "crates/persistence-sqlite",
  "crates/subtitle-core",
]
exclude = ["spikes/tauri-libmpv/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.4.0"

[workspace.dependencies]
axum = "0.8"
async-stream = "0.3"
async-trait = "0.1"
futures-core = "0.3"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
tower = "0.5"
